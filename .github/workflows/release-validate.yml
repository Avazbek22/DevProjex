name: Release Validation

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master", "v5.1", "v5.2" ]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DEVPROJEX_SKIP_TUI_PTY_TESTS: 1

concurrency:
  group: release-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan-release:
    name: Plan Release Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_release: ${{ steps.plan.outputs.run_release }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate CI planner contracts
        shell: pwsh
        run: ./Scripts/ci/Test-CiChangePlanner.ps1

      - name: Select release validation plan
        id: plan
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIOUS_GATE_NAME: Release Gate
        run: >
          ./Scripts/ci/Select-CiPlan.ps1
          -GitHubEventPath $env:GITHUB_EVENT_PATH
          -GitHubEventName $env:GITHUB_EVENT_NAME
          -PreviousGateName $env:PREVIOUS_GATE_NAME
          -GitHubOutputPath $env:GITHUB_OUTPUT

  validate-release-config:
    name: Validate Release Config
    needs: plan-release
    if: ${{ needs.plan-release.outputs.run_release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Validate release metadata and Store alias contract
        shell: pwsh
        run: ./Scripts/release-all.ps1 -ValidateConfigOnly

  prepare-publish-matrix:
    name: Prepare Publish Matrix
    needs: validate-release-config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Select publish smoke matrix
        id: set-matrix
        shell: pwsh
        run: |
          $matrix = @{
            include = @(
              @{ runner = 'windows-latest'; rid = 'win-x64'; binary = 'DevProjex.exe'; completion_shells = 'bash,powershell' },
              @{ runner = 'windows-11-arm'; rid = 'win-arm64'; binary = 'DevProjex.exe'; completion_shells = 'powershell' },
              @{ runner = 'ubuntu-latest'; rid = 'linux-x64'; binary = 'DevProjex'; completion_shells = 'bash,zsh,fish,powershell' },
              @{ runner = 'ubuntu-24.04-arm'; rid = 'linux-arm64'; binary = 'DevProjex'; completion_shells = 'bash,zsh,fish,powershell' },
              @{ runner = 'macos-15-intel'; rid = 'osx-x64'; binary = 'DevProjex'; completion_shells = 'zsh,powershell' },
              # Keep native PTY validation on a stable GA image instead of a moving latest alias.
              @{ runner = 'macos-15'; rid = 'osx-arm64'; binary = 'DevProjex'; completion_shells = 'zsh,powershell' }
            )
          }

          "matrix=$($matrix | ConvertTo-Json -Compress -Depth 4)" >> $env:GITHUB_OUTPUT

  publish-smoke:
    name: Publish Smoke (${{ matrix.rid }})
    needs: prepare-publish-matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-publish-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Linux release-smoke dependencies
        if: ${{ startsWith(matrix.rid, 'linux-') }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb zsh fish

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        shell: pwsh
        run: dotnet restore DevProjex.sln

      - name: Validate Linux DBus Dependency Graph
        if: ${{ startsWith(matrix.rid, 'linux-') }}
        shell: pwsh
        run: |
          $packageFiles = Get-ChildItem -Path "." -Recurse -Include "*.csproj", "*.props", "*.targets" -File |
            Where-Object { $_.FullName -notmatch "[\\/](bin|obj)[\\/]" }
          $directTmdsOverrides = @(
            foreach ($packageFile in $packageFiles) {
              [xml]$packageXml = Get-Content -Raw -Path $packageFile.FullName
              foreach ($item in $packageXml.SelectNodes("//*[local-name()='PackageReference' or local-name()='PackageVersion']")) {
                if ($item.Include -eq "Tmds.DBus.Protocol") {
                  Resolve-Path -Relative $packageFile.FullName
                }
              }
            }
          )

          if ($directTmdsOverrides.Count -gt 0) {
            throw "Do not override Tmds.DBus.Protocol directly. Avalonia.FreeDesktop owns the compatible DBus version. Overrides found in: $($directTmdsOverrides -join ', ')"
          }

          $assetsPath = "Apps/Avalonia/obj/project.assets.json"
          if (-not (Test-Path -LiteralPath $assetsPath)) {
            throw "Project assets file was not produced by restore: $assetsPath"
          }

          $assets = Get-Content -Raw -Path $assetsPath | ConvertFrom-Json
          $dbusLibraries = @(
            $assets.libraries.PSObject.Properties.Name |
              Where-Object { $_ -like "Tmds.DBus.Protocol/*" }
          )
          $freeDesktopLibraries = @(
            $assets.libraries.PSObject.Properties.Name |
              Where-Object { $_ -like "Avalonia.FreeDesktop/*" }
          )

          if ($freeDesktopLibraries.Count -ne 1) {
            throw "Expected exactly one Avalonia.FreeDesktop library in the restore graph, found $($freeDesktopLibraries.Count): $($freeDesktopLibraries -join ', ')"
          }

          if ($dbusLibraries.Count -ne 1) {
            throw "Expected exactly one Tmds.DBus.Protocol library in the restore graph, found $($dbusLibraries.Count): $($dbusLibraries -join ', ')"
          }

          $freeDesktopVersionText = $freeDesktopLibraries[0].Substring("Avalonia.FreeDesktop/".Length)
          $freeDesktopVersion = [Version]$freeDesktopVersionText
          if ($freeDesktopVersion -lt [Version]"12.1.0") {
            throw "Avalonia.FreeDesktop 12.1.0+ is required for the updated Tmds.DBus.Protocol API boundary. Resolved: $freeDesktopVersionText"
          }

          $versionText = $dbusLibraries[0].Substring("Tmds.DBus.Protocol/".Length)
          $version = [Version]$versionText
          if ($version -lt [Version]"0.94.0") {
            throw "Avalonia.FreeDesktop 12.1.0+ should resolve the updated Tmds.DBus.Protocol graph. Resolved: $versionText"
          }

      - name: Publish
        shell: pwsh
        # ReadyToRun validates the same startup-oriented publish shape as release artifacts.
        run: >
          dotnet publish Apps/Avalonia/DevProjex.Avalonia.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:PublishReadyToRun=true
          /p:PublishTrimmed=false
          /p:DebugType=None
          /p:DebugSymbols=false
          -o artifacts/publish/${{ matrix.rid }}

      - name: Validate Single-File Output
        shell: pwsh
        run: |
          $publishDirectory = "artifacts/publish/${{ matrix.rid }}"
          $files = @(Get-ChildItem -LiteralPath $publishDirectory -File -Recurse)
          $relativeFiles = @(
            $files | ForEach-Object {
              [System.IO.Path]::GetRelativePath($publishDirectory, $_.FullName)
            }
          )
          if ($files.Count -ne 1 -or
              -not [System.StringComparer]::Ordinal.Equals(
                $relativeFiles[0],
                "${{ matrix.binary }}")) {
            $actualFiles = $relativeFiles -join ", "
            throw "Expected exactly one published file named '${{ matrix.binary }}' for ${{ matrix.rid }}. Found: $actualFiles"
          }

          Write-Host "Validated $($relativeFiles[0]) for ${{ matrix.rid }}: $($files[0].Length) bytes."

      - name: Startup Smoke (Windows)
        if: ${{ startsWith(matrix.rid, 'win-') }}
        shell: pwsh
        run: |
          $exePath = (Resolve-Path "artifacts/publish/${{ matrix.rid }}/${{ matrix.binary }}").Path
          $workingDirectory = Split-Path -Path $exePath -Parent

          $process = Start-Process -FilePath $exePath -WorkingDirectory $workingDirectory -PassThru
          try {
            Start-Sleep -Seconds 5
            $process.Refresh()

            if ($process.HasExited) {
              throw "Published app exited too early during startup smoke. ExitCode=$($process.ExitCode)"
            }

            Write-Host "Startup smoke passed. Process stayed alive for 5 seconds."
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              $process.WaitForExit(5000) | Out-Null
            }
          }

      - name: Startup Smoke (Linux X11)
        if: ${{ startsWith(matrix.rid, 'linux-') }}
        shell: bash
        run: |
          set -euo pipefail
          exe_path="$(realpath "artifacts/publish/${{ matrix.rid }}/${{ matrix.binary }}")"
          work_dir="$(dirname "$exe_path")"
          chmod +x "$exe_path"

          xvfb-run -a bash -c '
            set -euo pipefail
            cd "$1"
            env -u CI "$2" &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            sleep 5

            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid"
              exit_code=$?
              echo "Published Linux app exited too early during X11 startup smoke. ExitCode=$exit_code"
              exit 1
            fi

            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          ' _ "$work_dir" "$exe_path"

          echo "Linux X11 startup smoke passed. Process stayed alive for 5 seconds."

      - name: Startup Smoke (macOS)
        if: ${{ startsWith(matrix.rid, 'osx-') }}
        shell: bash
        run: |
          set -euo pipefail
          exe_path="$(realpath "artifacts/publish/${{ matrix.rid }}/${{ matrix.binary }}")"
          work_dir="$(dirname "$exe_path")"
          chmod +x "$exe_path"

          (
            cd "$work_dir"
            env -u CI "$exe_path" &
            pid=$!
            trap 'kill "$pid" 2>/dev/null || true' EXIT
            sleep 5

            if ! kill -0 "$pid" 2>/dev/null; then
              set +e
              wait "$pid"
              exit_code=$?
              set -e
              echo "Published macOS app exited too early during startup smoke. ExitCode=$exit_code"
              exit 1
            fi

            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          )

          echo "macOS startup smoke passed. Process stayed alive for 5 seconds."

      - name: Command-line Smoke (Native Published Artifact)
        shell: pwsh
        run: |
          $exePath = (Resolve-Path "artifacts/publish/${{ matrix.rid }}/${{ matrix.binary }}").Path
          $helpArguments = @("--help", "-h", "/?")
          $buildProps = [xml](Get-Content -Raw -Path "Directory.Build.props")
          $expectedVersionNode = $buildProps.SelectSingleNode("/Project/PropertyGroup/DevProjexVersion")
          if ($null -eq $expectedVersionNode -or [string]::IsNullOrWhiteSpace($expectedVersionNode.InnerText)) {
            throw "DevProjexVersion was not found in Directory.Build.props."
          }

          $expectedVersion = $expectedVersionNode.InnerText.Trim()

          if ($env:RUNNER_OS -ne "Windows") {
            chmod +x $exePath
          }

          function Invoke-NativeCommand {
            param(
              [Parameter(Mandatory = $true)]
              [string] $Name,
              [Parameter(Mandatory = $true)]
              [string[]] $Arguments,
              [hashtable] $Environment = @{}
            )

            $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = $exePath
            $startInfo.UseShellExecute = $false
            $startInfo.CreateNoWindow = $true
            $startInfo.RedirectStandardOutput = $true
            $startInfo.RedirectStandardError = $true
            foreach ($argument in $Arguments) {
              $startInfo.ArgumentList.Add($argument)
            }
            foreach ($entry in $Environment.GetEnumerator()) {
              if ($null -eq $entry.Value) {
                $startInfo.Environment.Remove([string] $entry.Key)
              }
              else {
                $startInfo.Environment[[string] $entry.Key] = [string] $entry.Value
              }
            }

            $process = [System.Diagnostics.Process]::new()
            $process.StartInfo = $startInfo
            if (-not $process.Start()) {
              throw "Could not start published command '$Name'."
            }

            $stdoutTask = $process.StandardOutput.ReadToEndAsync()
            $stderrTask = $process.StandardError.ReadToEndAsync()
            if (-not $process.WaitForExit(60000)) {
              $process.Kill($true)
              throw "Published command '$Name' timed out."
            }

            $result = [pscustomobject]@{
              ExitCode = $process.ExitCode
              StdOut = $stdoutTask.GetAwaiter().GetResult()
              StdErr = $stderrTask.GetAwaiter().GetResult()
            }
            $process.Dispose()
            return $result
          }

          foreach ($helpArgument in $helpArguments) {
            $safeName = $helpArgument -replace "[^A-Za-z0-9]+", "_"
            $stdoutPath = Join-Path $env:RUNNER_TEMP "devprojex-native-help-$safeName-stdout.txt"
            $stderrPath = Join-Path $env:RUNNER_TEMP "devprojex-native-help-$safeName-stderr.txt"

            Remove-Item -LiteralPath $stdoutPath, $stderrPath -ErrorAction SilentlyContinue

            if ($env:RUNNER_OS -eq "Windows") {
              $process = Start-Process `
                -FilePath $exePath `
                -ArgumentList @($helpArgument, "--language", "en") `
                -RedirectStandardOutput $stdoutPath `
                -RedirectStandardError $stderrPath `
                -NoNewWindow `
                -Wait `
                -PassThru
              $exitCode = $process.ExitCode
            }
            else {
              & $exePath $helpArgument "--language" "en" > $stdoutPath 2> $stderrPath
              $exitCode = $LASTEXITCODE
            }

            $stdout = Get-Content -Raw -Path $stdoutPath -ErrorAction SilentlyContinue
            $stderr = Get-Content -Raw -Path $stderrPath -ErrorAction SilentlyContinue

            if ($exitCode -ne 0) {
              throw "Published $helpArgument smoke failed for ${{ matrix.rid }}. ExitCode=$exitCode. StdErr=$stderr"
            }

            if ($stdout -notmatch "(?m)^USAGE\r?$") {
              throw "Published $helpArgument smoke did not print usage text for ${{ matrix.rid }}. StdOut=$stdout StdErr=$stderr"
            }
          }

          $versionStdoutPath = Join-Path $env:RUNNER_TEMP "devprojex-native-version-stdout.txt"
          $versionStderrPath = Join-Path $env:RUNNER_TEMP "devprojex-native-version-stderr.txt"
          Remove-Item -LiteralPath $versionStdoutPath, $versionStderrPath -ErrorAction SilentlyContinue

          if ($env:RUNNER_OS -eq "Windows") {
            $process = Start-Process `
              -FilePath $exePath `
              -ArgumentList @("--version") `
              -RedirectStandardOutput $versionStdoutPath `
              -RedirectStandardError $versionStderrPath `
              -NoNewWindow `
              -Wait `
              -PassThru
            $exitCode = $process.ExitCode
          }
          else {
            & $exePath "--version" > $versionStdoutPath 2> $versionStderrPath
            $exitCode = $LASTEXITCODE
          }

          $versionStdout = Get-Content -Raw -Path $versionStdoutPath -ErrorAction SilentlyContinue
          $versionStderr = Get-Content -Raw -Path $versionStderrPath -ErrorAction SilentlyContinue
          $actualVersion = if ($null -eq $versionStdout) { "" } else { $versionStdout.Trim() }

          if ($exitCode -ne 0) {
            throw "Published --version smoke failed for ${{ matrix.rid }}. ExitCode=$exitCode. StdErr=$versionStderr"
          }

          if (-not [string]::IsNullOrWhiteSpace($versionStderr)) {
            throw "Published --version smoke wrote unexpected stderr for ${{ matrix.rid }}. StdErr=$versionStderr"
          }

          if ($actualVersion -ne $expectedVersion) {
            throw "Published --version printed '$actualVersion' for ${{ matrix.rid }}, expected '$expectedVersion'."
          }

          $projectDirectory = Join-Path $env:RUNNER_TEMP "devprojex-native-export-project-${{ matrix.rid }}"
          $sourceDirectory = Join-Path $projectDirectory "src"
          New-Item -ItemType Directory -Force -Path $sourceDirectory | Out-Null
          "class App {}" | Set-Content -LiteralPath (Join-Path $sourceDirectory "App.cs") -Encoding utf8NoBOM
          $githubDirectory = Join-Path $projectDirectory ".github"
          $gitLookalikeDirectory = Join-Path $projectDirectory ".git-owned"
          New-Item -ItemType Directory -Force -Path $githubDirectory, $gitLookalikeDirectory | Out-Null
          "name: ci" | Set-Content -LiteralPath (Join-Path $githubDirectory "ci.yml") -Encoding utf8NoBOM
          "ordinary content" | Set-Content -LiteralPath (Join-Path $gitLookalikeDirectory "data.txt") -Encoding utf8NoBOM
          "untracked" | Set-Content -LiteralPath (Join-Path $projectDirectory "untracked.txt") -Encoding utf8NoBOM
          git -C $projectDirectory init --quiet
          if ($LASTEXITCODE -ne 0) { throw "Failed to initialize published ignore-contract fixture." }
          git -C $projectDirectory add -- "src/App.cs" ".github/ci.yml"
          if ($LASTEXITCODE -ne 0) { throw "Failed to stage published tracked-mode fixture." }

          $exportStdoutPath = Join-Path $env:RUNNER_TEMP "devprojex-native-export-stdout.txt"
          $exportStderrPath = Join-Path $env:RUNNER_TEMP "devprojex-native-export-stderr.txt"
          Remove-Item -LiteralPath $exportStdoutPath, $exportStderrPath -ErrorAction SilentlyContinue
          $exportArguments = @(
            "export", "context", $projectDirectory,
            "--view", "tree",
            "--format", "text",
            "--root", "src",
            "--extension", "cs",
            "--git-mode", "none",
            "--exclude", "none",
            "--language", "en",
            "-o", "-")

          if ($env:RUNNER_OS -eq "Windows") {
            $process = Start-Process `
              -FilePath $exePath `
              -ArgumentList $exportArguments `
              -RedirectStandardOutput $exportStdoutPath `
              -RedirectStandardError $exportStderrPath `
              -NoNewWindow `
              -Wait `
              -PassThru
            $exitCode = $process.ExitCode
          }
          else {
            & $exePath @exportArguments > $exportStdoutPath 2> $exportStderrPath
            $exitCode = $LASTEXITCODE
          }

          $exportStdout = Get-Content -Raw -Path $exportStdoutPath -ErrorAction SilentlyContinue
          $exportStderr = Get-Content -Raw -Path $exportStderrPath -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {
            throw "Published export smoke failed for ${{ matrix.rid }}. ExitCode=$exitCode. StdErr=$exportStderr"
          }

          if (-not [string]::IsNullOrWhiteSpace($exportStderr)) {
            throw "Published export smoke wrote unexpected stderr for ${{ matrix.rid }}. StdErr=$exportStderr"
          }

          if ($exportStdout -notmatch "App\.cs") {
            throw "Published export smoke did not print the expected tree for ${{ matrix.rid }}. StdOut=$exportStdout"
          }

      - name: Extended Command-line Contracts (Native Published Artifact)
        shell: pwsh
        run: |
          $exePath = (Resolve-Path "artifacts/publish/${{ matrix.rid }}/${{ matrix.binary }}").Path
          $projectDirectory = Join-Path $env:RUNNER_TEMP "devprojex-native-export-project-${{ matrix.rid }}"
          $sourceDirectory = Join-Path $projectDirectory "src"

          function Invoke-NativeCommand {
            param(
              [Parameter(Mandatory = $true)]
              [string] $Name,
              [Parameter(Mandatory = $true)]
              [string[]] $Arguments,
              [hashtable] $Environment = @{}
            )

            $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = $exePath
            $startInfo.UseShellExecute = $false
            $startInfo.CreateNoWindow = $true
            $startInfo.RedirectStandardOutput = $true
            $startInfo.RedirectStandardError = $true
            foreach ($argument in $Arguments) {
              $startInfo.ArgumentList.Add($argument)
            }
            foreach ($entry in $Environment.GetEnumerator()) {
              if ($null -eq $entry.Value) {
                $startInfo.Environment.Remove([string] $entry.Key)
              }
              else {
                $startInfo.Environment[[string] $entry.Key] = [string] $entry.Value
              }
            }

            $process = [System.Diagnostics.Process]::new()
            $process.StartInfo = $startInfo
            if (-not $process.Start()) {
              throw "Could not start published command '$Name'."
            }

            $stdoutTask = $process.StandardOutput.ReadToEndAsync()
            $stderrTask = $process.StandardError.ReadToEndAsync()
            if (-not $process.WaitForExit(60000)) {
              $process.Kill($true)
              throw "Published command '$Name' timed out."
            }

            $result = [pscustomobject]@{
              ExitCode = $process.ExitCode
              StdOut = $stdoutTask.GetAwaiter().GetResult()
              StdErr = $stderrTask.GetAwaiter().GetResult()
            }
            $process.Dispose()
            return $result
          }

          $smartSecretsProject = Join-Path `
            $env:RUNNER_TEMP `
            "devprojex-smart-secrets-${{ matrix.rid }}"
          Remove-Item -LiteralPath $smartSecretsProject -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $smartSecretsProject | Out-Null
          $smartSecretsSourcePath = Join-Path $smartSecretsProject "appsettings.json"
          $originalPassword = "Admin123!"
          $smartSecretsSource = @"
          {
            "ConnectionStrings": {
              "Primary": "Host=db;Username=admin;Password=$originalPassword;Database=app"
            }
          }
          "@
          $smartSecretsSource | Set-Content `
            -LiteralPath $smartSecretsSourcePath `
            -Encoding utf8NoBOM `
            -NoNewline
          $smartSecretsSourceBytes = [System.IO.File]::ReadAllBytes($smartSecretsSourcePath)

          $smartSecretsContext = Invoke-NativeCommand `
            -Name "Smart Secrets context contract" `
            -Arguments @(
              "export", "context", $smartSecretsProject,
              "--view", "content",
              "--format", "text",
              "--git-mode", "none",
              "--exclude", "none",
              "--hide-secrets",
              "--plain",
              "--language", "en",
              "-o", "-")
          if ($smartSecretsContext.ExitCode -ne 0 -or
              -not [string]::IsNullOrWhiteSpace($smartSecretsContext.StdErr) -or
              $smartSecretsContext.StdOut.Contains($originalPassword, [StringComparison]::Ordinal) -or
              -not $smartSecretsContext.StdOut.Contains(
                "Password=DEVPROJEX_REDACTED[connection-password#1]",
                [StringComparison]::Ordinal)) {
            throw "Published Smart Secrets context contract failed. ExitCode=$($smartSecretsContext.ExitCode) StdOut=$($smartSecretsContext.StdOut) StdErr=$($smartSecretsContext.StdErr)"
          }

          $smartSecretsSourceBytesAfter = [System.IO.File]::ReadAllBytes($smartSecretsSourcePath)
          if ([Convert]::ToBase64String($smartSecretsSourceBytes) -ne
              [Convert]::ToBase64String($smartSecretsSourceBytesAfter)) {
            throw "Published Smart Secrets context export modified the source file."
          }

          $emptyGitIgnoreDestination = Join-Path $env:RUNNER_TEMP "devprojex-empty-gitignore-${{ matrix.rid }}"
          Remove-Item -LiteralPath $emptyGitIgnoreDestination -Recurse -Force -ErrorAction SilentlyContinue
          $emptyGitIgnore = Invoke-NativeCommand -Name "empty gitignore contract" -Arguments @(
            "export", "project", $projectDirectory,
            "--as", "folder",
            "--git-mode", "gitignore",
            "--exclude", "none",
            "--plain",
            "--language", "en",
            "-o", $emptyGitIgnoreDestination)
          if ($emptyGitIgnore.ExitCode -ne 0 -or
              -not [string]::IsNullOrWhiteSpace($emptyGitIgnore.StdErr) -or
              -not (Test-Path -LiteralPath (Join-Path $emptyGitIgnoreDestination ".github/ci.yml") -PathType Leaf) -or
              -not (Test-Path -LiteralPath (Join-Path $emptyGitIgnoreDestination ".git-owned/data.txt") -PathType Leaf) -or
              (Test-Path -LiteralPath (Join-Path $emptyGitIgnoreDestination ".git"))) {
            throw "Published empty-.gitignore mode leaked Git administration or hid a lookalike. ExitCode=$($emptyGitIgnore.ExitCode) StdOut=$($emptyGitIgnore.StdOut) StdErr=$($emptyGitIgnore.StdErr)"
          }
          $emptyGitIgnoreManifest = @(
            Get-ChildItem -LiteralPath $emptyGitIgnoreDestination -Force -File -Recurse |
              ForEach-Object {
                [System.IO.Path]::GetRelativePath($emptyGitIgnoreDestination, $_.FullName).Replace('\', '/')
              })
          $expectedEmptyGitIgnoreManifest = @(
            ".github/ci.yml",
            ".git-owned/data.txt",
            "src/App.cs",
            "untracked.txt")
          $emptyGitIgnoreManifestSet =
            [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          $emptyGitIgnoreManifestSet.UnionWith([string[]] $emptyGitIgnoreManifest)
          $expectedEmptyGitIgnoreManifestSet =
            [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          $expectedEmptyGitIgnoreManifestSet.UnionWith([string[]] $expectedEmptyGitIgnoreManifest)
          if ($emptyGitIgnoreManifestSet.Count -ne $emptyGitIgnoreManifest.Count -or
              $expectedEmptyGitIgnoreManifestSet.Count -ne $expectedEmptyGitIgnoreManifest.Count -or
              -not $emptyGitIgnoreManifestSet.SetEquals($expectedEmptyGitIgnoreManifestSet)) {
            throw "Published empty-.gitignore manifest drifted. Actual=$($emptyGitIgnoreManifest -join ', ')"
          }

          $trackedOnlyDestination = Join-Path $env:RUNNER_TEMP "devprojex-tracked-only-${{ matrix.rid }}"
          Remove-Item -LiteralPath $trackedOnlyDestination -Recurse -Force -ErrorAction SilentlyContinue
          $trackedOnly = Invoke-NativeCommand -Name "tracked-only contract" -Arguments @(
            "export", "project", $projectDirectory,
            "--as", "folder",
            "--git-mode", "tracked",
            "--exclude", "none",
            "--plain",
            "--language", "en",
            "-o", $trackedOnlyDestination)
          if ($trackedOnly.ExitCode -ne 0 -or
              -not [string]::IsNullOrWhiteSpace($trackedOnly.StdErr) -or
              -not (Test-Path -LiteralPath (Join-Path $trackedOnlyDestination "src/App.cs") -PathType Leaf) -or
              -not (Test-Path -LiteralPath (Join-Path $trackedOnlyDestination ".github/ci.yml") -PathType Leaf) -or
              (Test-Path -LiteralPath (Join-Path $trackedOnlyDestination "untracked.txt")) -or
              (Test-Path -LiteralPath (Join-Path $trackedOnlyDestination ".git-owned/data.txt")) -or
              (Test-Path -LiteralPath (Join-Path $trackedOnlyDestination ".git"))) {
            throw "Published tracked-only mode violated its exact manifest contract. ExitCode=$($trackedOnly.ExitCode) StdOut=$($trackedOnly.StdOut) StdErr=$($trackedOnly.StdErr)"
          }
          $trackedOnlyManifest = @(
            Get-ChildItem -LiteralPath $trackedOnlyDestination -Force -File -Recurse |
              ForEach-Object {
                [System.IO.Path]::GetRelativePath($trackedOnlyDestination, $_.FullName).Replace('\', '/')
              })
          $expectedTrackedOnlyManifest = @(".github/ci.yml", "src/App.cs")
          $trackedOnlyManifestSet =
            [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          $trackedOnlyManifestSet.UnionWith([string[]] $trackedOnlyManifest)
          $expectedTrackedOnlyManifestSet =
            [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          $expectedTrackedOnlyManifestSet.UnionWith([string[]] $expectedTrackedOnlyManifest)
          if ($trackedOnlyManifestSet.Count -ne $trackedOnlyManifest.Count -or
              $expectedTrackedOnlyManifestSet.Count -ne $expectedTrackedOnlyManifest.Count -or
              -not $trackedOnlyManifestSet.SetEquals($expectedTrackedOnlyManifestSet)) {
            throw "Published tracked-only manifest drifted. Actual=$($trackedOnlyManifest -join ', ')"
          }

          $sourceBytesBeforeProjectExport =
            [System.IO.File]::ReadAllBytes((Join-Path $sourceDirectory "App.cs"))
          $folderDestination = Join-Path `
            $env:RUNNER_TEMP `
            "devprojex-native-project-folder-${{ matrix.rid }}"
          Remove-Item -LiteralPath $folderDestination -Recurse -Force -ErrorAction SilentlyContinue
          $folderExport = Invoke-NativeCommand -Name "project folder export" -Arguments @(
            "export", "project", $projectDirectory,
            "--as", "FoLdEr",
            "--git-mode", "none",
            "--exclude", "none",
            "--progress", "never",
            "--plain",
            "--language", "en",
            "-o", $folderDestination)
          $expectedFolderPath = [System.IO.Path]::GetFullPath($folderDestination)
          if ($folderExport.ExitCode -ne 0 -or
              -not [string]::IsNullOrWhiteSpace($folderExport.StdErr) -or
              $folderExport.StdOut.Trim() -ne $expectedFolderPath -or
              -not (Test-Path -LiteralPath (Join-Path $folderDestination "src/App.cs") -PathType Leaf)) {
            throw "Published folder project export violated its artifact/stdout contract. ExitCode=$($folderExport.ExitCode) StdOut=$($folderExport.StdOut) StdErr=$($folderExport.StdErr)"
          }

          $zipDestination = Join-Path `
            $env:RUNNER_TEMP `
            "devprojex-native-project-${{ matrix.rid }}.zip"
          Remove-Item -LiteralPath $zipDestination -Force -ErrorAction SilentlyContinue
          $zipExport = Invoke-NativeCommand -Name "project ZIP export" -Arguments @(
            "export", "project", $projectDirectory,
            "--as=ZiP",
            "--git-mode", "none",
            "--exclude", "none",
            "--progress", "never",
            "--plain",
            "--language", "en",
            "-o", $zipDestination)
          $expectedZipPath = [System.IO.Path]::GetFullPath($zipDestination)
          if ($zipExport.ExitCode -ne 0 -or
              -not [string]::IsNullOrWhiteSpace($zipExport.StdErr) -or
              $zipExport.StdOut.Trim() -ne $expectedZipPath -or
              -not (Test-Path -LiteralPath $zipDestination -PathType Leaf)) {
            throw "Published ZIP project export violated its artifact/stdout contract. ExitCode=$($zipExport.ExitCode) StdOut=$($zipExport.StdOut) StdErr=$($zipExport.StdErr)"
          }
          $zipArchive = [System.IO.Compression.ZipFile]::OpenRead($zipDestination)
          try {
            if (-not ($zipArchive.Entries | Where-Object { $_.FullName -match "(^|/)src/App\.cs$" })) {
              throw "Published ZIP project export did not contain src/App.cs."
            }
          }
          finally {
            $zipArchive.Dispose()
          }

          $sourceBytesAfterProjectExport =
            [System.IO.File]::ReadAllBytes((Join-Path $sourceDirectory "App.cs"))
          if ([Convert]::ToBase64String($sourceBytesBeforeProjectExport) -ne
              [Convert]::ToBase64String($sourceBytesAfterProjectExport)) {
            throw "Published project export modified the source file."
          }

      - name: Machine-output and Failure Contracts (Native Published Artifact)
        shell: pwsh
        run: |
          $exePath = (Resolve-Path "artifacts/publish/${{ matrix.rid }}/${{ matrix.binary }}").Path
          $projectDirectory = Join-Path $env:RUNNER_TEMP "devprojex-native-export-project-${{ matrix.rid }}"

          function Invoke-NativeCommand {
            param(
              [Parameter(Mandatory = $true)]
              [string] $Name,
              [Parameter(Mandatory = $true)]
              [string[]] $Arguments,
              [hashtable] $Environment = @{}
            )

            $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = $exePath
            $startInfo.UseShellExecute = $false
            $startInfo.CreateNoWindow = $true
            $startInfo.RedirectStandardOutput = $true
            $startInfo.RedirectStandardError = $true
            foreach ($argument in $Arguments) {
              $startInfo.ArgumentList.Add($argument)
            }
            foreach ($entry in $Environment.GetEnumerator()) {
              if ($null -eq $entry.Value) {
                $startInfo.Environment.Remove([string] $entry.Key)
              }
              else {
                $startInfo.Environment[[string] $entry.Key] = [string] $entry.Value
              }
            }

            $process = [System.Diagnostics.Process]::new()
            $process.StartInfo = $startInfo
            if (-not $process.Start()) {
              throw "Could not start published command '$Name'."
            }

            $stdoutTask = $process.StandardOutput.ReadToEndAsync()
            $stderrTask = $process.StandardError.ReadToEndAsync()
            if (-not $process.WaitForExit(60000)) {
              $process.Kill($true)
              throw "Published command '$Name' timed out."
            }

            $result = [pscustomobject]@{
              ExitCode = $process.ExitCode
              StdOut = $stdoutTask.GetAwaiter().GetResult()
              StdErr = $stderrTask.GetAwaiter().GetResult()
            }
            $process.Dispose()
            return $result
          }

          $analysis = Invoke-NativeCommand -Name "mixed-case analysis JSON" -Arguments @(
            "analyze", $projectDirectory,
            "--format=JsOn",
            "--git-mode", "none",
            "--exclude", "none",
            "--plain",
            "--language", "en")
          if ($analysis.ExitCode -ne 0 -or -not [string]::IsNullOrWhiteSpace($analysis.StdErr)) {
            throw "Published mixed-case JSON analysis failed. ExitCode=$($analysis.ExitCode). StdErr=$($analysis.StdErr)"
          }
          try {
            $analysisDocument = $analysis.StdOut | ConvertFrom-Json -Depth 32
          }
          catch {
            throw "Published analysis stdout is not valid JSON: $($_.Exception.Message)"
          }
          if ($analysisDocument.kind -ne "devprojex-analysis" -or $analysis.StdOut.Contains([char] 0x1b)) {
            throw "Published analysis JSON violated its machine-output contract."
          }

          $xmlContext = Invoke-NativeCommand -Name "mixed-case context XML" -Arguments @(
            "export", "context", $projectDirectory,
            "--view", "TrEe-CoNtEnT",
            "--format", "XML",
            "--git-mode", "none",
            "--exclude", "none",
            "--plain",
            "--language", "en",
            "-o", "-")
          if ($xmlContext.ExitCode -ne 0 -or -not [string]::IsNullOrWhiteSpace($xmlContext.StdErr)) {
            throw "Published context XML failed. ExitCode=$($xmlContext.ExitCode). StdErr=$($xmlContext.StdErr)"
          }
          try {
            [xml] $xmlDocument = $xmlContext.StdOut
          }
          catch {
            throw "Published context stdout is not valid XML: $($_.Exception.Message)"
          }
          if ($xmlDocument.DocumentElement.LocalName -ne "devprojexContext" -or $xmlContext.StdOut.Contains([char] 0x1b)) {
            throw "Published context XML violated its machine-output contract."
          }

          $plainContext = Invoke-NativeCommand -Name "plain context" -Arguments @(
            "export", "context", $projectDirectory,
            "--view", "tree",
            "--format", "text",
            "--git-mode", "none",
            "--exclude", "none",
            "--plain",
            "--language", "en",
            "-o", "-")
          $forbiddenPlainCharacters = [char[]] @(0x1b, 0x2500, 0x2502, 0x256d, 0x256e, 0x256f, 0x2570)
          if ($plainContext.ExitCode -ne 0 -or
              -not [string]::IsNullOrWhiteSpace($plainContext.StdErr) -or
              $plainContext.StdOut.IndexOfAny($forbiddenPlainCharacters) -ge 0) {
            throw "Published --plain context contained terminal decoration or failed. ExitCode=$($plainContext.ExitCode)"
          }

          $noColorAnalysis = Invoke-NativeCommand `
            -Name "NO_COLOR analysis" `
            -Arguments @(
              "analyze", $projectDirectory,
              "--format", "text",
              "--git-mode", "none",
              "--exclude", "none",
              "--language", "en") `
            -Environment @{ "NO_COLOR" = "1" }
          if ($noColorAnalysis.ExitCode -ne 0 -or $noColorAnalysis.StdOut.Contains([char] 0x1b)) {
            throw "Published NO_COLOR invocation emitted ANSI or failed. ExitCode=$($noColorAnalysis.ExitCode)"
          }

          $dumbAnalysis = Invoke-NativeCommand `
            -Name "TERM=dumb analysis" `
            -Arguments @(
              "analyze", $projectDirectory,
              "--format", "text",
              "--git-mode", "none",
              "--exclude", "none",
              "--language", "en") `
            -Environment @{ "TERM" = "dumb" }
          if ($dumbAnalysis.ExitCode -ne 0 -or $dumbAnalysis.StdOut.Contains([char] 0x1b)) {
            throw "Published TERM=dumb invocation emitted ANSI or failed. ExitCode=$($dumbAnalysis.ExitCode)"
          }

          $plainColorConflict = Invoke-NativeCommand -Name "plain/color conflict" -Arguments @(
            "analyze", $projectDirectory,
            "--plain",
            "--color", "always",
            "--language", "en")
          if ($plainColorConflict.ExitCode -ne 2 -or
              -not [string]::IsNullOrEmpty($plainColorConflict.StdOut) -or
              [string]::IsNullOrWhiteSpace($plainColorConflict.StdErr)) {
            throw "Published --plain/--color always conflict did not return a clean usage error."
          }

          $dryRunDirectory = Join-Path $env:RUNNER_TEMP "devprojex-native-dry-run-${{ matrix.rid }}"
          $dryRunDestination = Join-Path $dryRunDirectory "context.md"
          Remove-Item -LiteralPath $dryRunDirectory -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $dryRunDirectory -Force | Out-Null
          $dryRun = Invoke-NativeCommand -Name "context dry-run" -Arguments @(
            "export", "context", $projectDirectory,
            "--format", "markdown",
            "--git-mode", "none",
            "--exclude", "none",
            "--dry-run",
            "--language", "en",
            "-o", $dryRunDestination)
          $dryRunParentExists =
            Test-Path -LiteralPath $dryRunDirectory -PathType Container
          $dryRunDestinationExists =
            Test-Path -LiteralPath $dryRunDestination
          $dryRunArtifacts = @(
            if ($dryRunParentExists) {
              Get-ChildItem -LiteralPath $dryRunDirectory -Force
            }
          )
          if ($dryRun.ExitCode -ne 0 -or
              -not [string]::IsNullOrEmpty($dryRun.StdOut) -or
              [string]::IsNullOrWhiteSpace($dryRun.StdErr) -or
              -not $dryRunParentExists -or
              $dryRunDestinationExists -or
              $dryRunArtifacts.Count -ne 0) {
            $artifactNames = @($dryRunArtifacts | ForEach-Object { $_.Name }) -join ", "
            throw "Published dry-run violated its preflight/no-effects contract. ExitCode=$($dryRun.ExitCode) StdOut=$($dryRun.StdOut) StdErr=$($dryRun.StdErr) ParentExists=$dryRunParentExists DestinationExists=$dryRunDestinationExists Artifacts=$artifactNames"
          }

          $conflictDestination = Join-Path $env:RUNNER_TEMP "devprojex-native-conflict-${{ matrix.rid }}.md"
          "preserve-me" | Set-Content -LiteralPath $conflictDestination -Encoding utf8NoBOM
          $originalConflictBytes = [System.IO.File]::ReadAllBytes($conflictDestination)
          $conflict = Invoke-NativeCommand -Name "existing destination conflict" -Arguments @(
            "export", "context", $projectDirectory,
            "--format", "markdown",
            "--git-mode", "none",
            "--exclude", "none",
            "--language", "en",
            "-o", $conflictDestination)
          $actualConflictBytes = [System.IO.File]::ReadAllBytes($conflictDestination)
          if ($conflict.ExitCode -ne 4 -or
              -not [string]::IsNullOrEmpty($conflict.StdOut) -or
              [string]::IsNullOrWhiteSpace($conflict.StdErr) -or
              [Convert]::ToBase64String($originalConflictBytes) -ne
                [Convert]::ToBase64String($actualConflictBytes)) {
            throw "Published existing-destination conflict overwrote output or returned the wrong contract."
          }

          Write-Host "Command-line smoke passed for ${{ matrix.rid }}."

      - name: Published Single-File Extraction Contract
        shell: pwsh
        run: |
          $env:DEVPROJEX_TUI_TEST_BINARY =
            (Resolve-Path "artifacts/publish/${{ matrix.rid }}/${{ matrix.binary }}").Path
          dotnet test Tests/DevProjex.Tests.Terminal/DevProjex.Tests.Terminal.csproj `
            -c Release `
            --no-restore `
            --filter "FullyQualifiedName~PublishedSingleFileExtractionProcessTests|FullyQualifiedName~McpServerProcessTests.PublishedSingleFileCompletesHandshakeListsToolsCallsToolAndExitsOnEof" `
            --logger "console;verbosity=minimal"

      - name: Published Completion Native Shell Integration
        shell: pwsh
        run: |
          $env:DEVPROJEX_TUI_TEST_BINARY =
            (Resolve-Path "artifacts/publish/${{ matrix.rid }}/${{ matrix.binary }}").Path
          $env:DEVPROJEX_COMPLETION_SHELLS = "${{ matrix.completion_shells }}"
          if ([string]::IsNullOrWhiteSpace($env:DEVPROJEX_COMPLETION_SHELLS)) {
            throw "Completion shell matrix is missing for ${{ matrix.rid }}."
          }
          dotnet test Tests/DevProjex.Tests.Terminal/DevProjex.Tests.Terminal.csproj `
            -c Release `
            --no-restore `
            --filter "FullyQualifiedName~GeneratedCompletionNativeShellIntegrationTests" `
            --logger "console;verbosity=minimal"

      - name: Enable Rootless Mount Namespace Gate (Linux x64)
        if: ${{ matrix.rid == 'linux-x64' }}
        shell: bash
        run: |
          set -euo pipefail
          apparmor_userns_policy=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          apparmor_userns_state="${RUNNER_TEMP}/devprojex-apparmor-userns-original"
          rm -f -- "$apparmor_userns_state"
          if [[ -e "$apparmor_userns_policy" ]]; then
            # GitHub's Ubuntu 24.04 runner blocks the rootless mount namespace used only by this safety probe.
            cat "$apparmor_userns_policy" > "$apparmor_userns_state"
            printf '0\n' | sudo tee "$apparmor_userns_policy" >/dev/null
          fi
          if ! unshare -Urnm true; then
            echo "::error::The runner cannot create the rootless mount namespace required by the destination-safety gate."
            exit 1
          fi

      - name: Nested-Mount Destination Safety Gate (Linux x64)
        if: ${{ matrix.rid == 'linux-x64' }}
        shell: pwsh
        env:
          DEVPROJEX_REQUIRE_ROOTLESS_MOUNT_TESTS: "1"
        run: |
          $filter = @(
            "FullyQualifiedName~DestinationNestedMountProcessTests.AnalyzeRejectsAliasToFileSystemMountedInsideSource",
            "FullyQualifiedName~DestinationNestedMountProcessTests.ContextForceRejectsFileBindAliasToMountedSourceFile"
          ) -join "|"
          dotnet test Tests/DevProjex.Tests.Terminal/DevProjex.Tests.Terminal.csproj `
            -c Release `
            --no-restore `
            --filter $filter `
            --logger "console;verbosity=minimal"

      - name: Restore Rootless Mount Namespace Policy (Linux x64)
        if: ${{ always() && matrix.rid == 'linux-x64' }}
        shell: bash
        run: |
          set -euo pipefail
          apparmor_userns_policy=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          apparmor_userns_state="${RUNNER_TEMP}/devprojex-apparmor-userns-original"
          if [[ -f "$apparmor_userns_state" ]]; then
            original_value="$(cat "$apparmor_userns_state")"
            printf '%s\n' "$original_value" | sudo tee "$apparmor_userns_policy" >/dev/null
            rm -f -- "$apparmor_userns_state"
          fi

      - name: Published Broken Pipe Smoke (Unix)
        if: ${{ !startsWith(matrix.rid, 'win-') }}
        shell: bash
        run: |
          set -euo pipefail
          exe_path="$(pwd)/artifacts/publish/${{ matrix.rid }}/${{ matrix.binary }}"
          project_dir="${RUNNER_TEMP}/devprojex-broken-pipe-${{ matrix.rid }}"
          stderr_path="${RUNNER_TEMP}/devprojex-broken-pipe-${{ matrix.rid }}.stderr"
          rm -rf -- "$project_dir"
          rm -f -- "$stderr_path"
          mkdir -p -- "$project_dir/src"
          for index in $(seq 1 64); do
            head -c 65536 /dev/zero | tr '\0' 'a' > "$project_dir/src/file-$index.txt"
          done

          "$exe_path" export context "$project_dir" \
            --view content \
            --format text \
            --git-mode none \
            --exclude none \
            --plain \
            --language en \
            -o - \
            2> "$stderr_path" | head -c 1 > /dev/null

          if [[ -s "$stderr_path" ]]; then
            echo "Expected a quiet broken-pipe exit; stderr was:"
            cat "$stderr_path"
            exit 1
          fi

      - name: Desktop IPC and Redirected EOF Smoke (Windows)
        if: ${{ startsWith(matrix.rid, 'win-') }}
        shell: pwsh
        run: |
          $exePath = (Resolve-Path "artifacts/publish/${{ matrix.rid }}/${{ matrix.binary }}").Path
          $projectDirectory = Join-Path $env:RUNNER_TEMP "devprojex-desktop-ipc-${{ matrix.rid }}"
          New-Item -ItemType Directory -Force -Path $projectDirectory | Out-Null
          "class App {}" | Set-Content -LiteralPath (Join-Path $projectDirectory "App.cs") -Encoding utf8NoBOM

          function Invoke-DevProjexProcess {
            param(
              [Parameter(Mandatory = $true)]
              [string[]] $Arguments,
              [int] $TimeoutMilliseconds = 30000,
              [scriptblock] $OnTimeout = $null
            )

            $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = $exePath
            $startInfo.WorkingDirectory = $projectDirectory
            $startInfo.UseShellExecute = $false
            $startInfo.CreateNoWindow = $true
            $startInfo.RedirectStandardOutput = $true
            $startInfo.RedirectStandardError = $true
            foreach ($argument in $Arguments) {
              $startInfo.ArgumentList.Add($argument)
            }

            $process = [System.Diagnostics.Process]::Start($startInfo)
            try {
              $stdoutTask = $process.StandardOutput.ReadToEndAsync()
              $stderrTask = $process.StandardError.ReadToEndAsync()
              $outputTasks = [System.Threading.Tasks.Task]::WhenAll(
                [System.Threading.Tasks.Task[]]@($stdoutTask, $stderrTask))
              if (-not $process.WaitForExit($TimeoutMilliseconds)) {
                $timeoutDiagnostics = "No timeout diagnostics were requested."
                if ($null -ne $OnTimeout) {
                  try {
                    $timeoutDiagnostics = [string](& $OnTimeout)
                  }
                  catch {
                    $timeoutDiagnostics = "Timeout diagnostic capture failed: $($_.Exception.Message)"
                  }
                }

                if (-not $process.HasExited) {
                  $process.Kill($true)
                }
                if (-not $process.WaitForExit(5000)) {
                  throw "Timed-out DevProjex process did not terminate after tree kill: $($Arguments -join ' ')"
                }
                if (-not $outputTasks.Wait(5000)) {
                  throw "Timed-out DevProjex process retained redirected handles: $($Arguments -join ' ')"
                }
                throw "DevProjex command timed out: $($Arguments -join ' '). Diagnostics=$timeoutDiagnostics"
              }

              if (-not $outputTasks.Wait(5000)) {
                throw "A desktop child retained redirected CLI handles after exit: $($Arguments -join ' ')"
              }

              $stdout = $stdoutTask.GetAwaiter().GetResult()
              $stderr = $stderrTask.GetAwaiter().GetResult()
              if ($process.ExitCode -ne 0) {
                throw "DevProjex command failed. ExitCode=$($process.ExitCode). Args=$($Arguments -join ' '). StdErr=$stderr"
              }
              if (-not [string]::IsNullOrEmpty($stderr)) {
                throw "DevProjex command unexpectedly wrote to stderr. Args=$($Arguments -join ' '). StdErr=$stderr"
              }

              return [pscustomobject]@{
                Stdout = $stdout
                Stderr = $stderr
              }
            }
            finally {
              $process.Dispose()
            }
          }

          function Get-DesktopTimeoutDiagnostics {
            try {
              $list = Invoke-DevProjexProcess `
                -Arguments @("ui", "list", "--format", "json", "--language", "en") `
                -TimeoutMilliseconds 10000
              $diagnostics = @("ui list: $($list.Stdout.Trim())")
              $instances = @(($list.Stdout | ConvertFrom-Json).instances)
              $matchingInstance = @(
                $instances |
                  Where-Object {
                    [IO.Path]::GetFullPath([string]$_.projectPath) -eq $expectedProjectPath
                  } |
                  Select-Object -First 1)
              if ($matchingInstance.Count -eq 1) {
                try {
                  $status = Invoke-DevProjexProcess `
                    -Arguments @(
                      "ui", "status",
                      "--instance", [string]$matchingInstance[0].instanceId,
                      "--language", "en") `
                    -TimeoutMilliseconds 10000
                  $diagnostics += "ui status: $($status.Stdout.Trim())"
                }
                catch {
                  $diagnostics += "ui status capture failed: $($_.Exception.Message)"
                }
              }

              return $diagnostics -join [Environment]::NewLine
            }
            catch {
              return "ui list capture failed: $($_.Exception.Message)"
            }
          }

          $desktopProcessId = $null
          $instanceId = $null
          $expectedProjectPath = (Resolve-Path $projectDirectory).Path
          try {
            # open --wait owns a two-minute application timeout. The outer watchdog
            # must let that contract return its typed failure before terminating it.
            $open = Invoke-DevProjexProcess `
              -Arguments @(
                "open", $projectDirectory,
                "--new-window",
                "--wait",
                "--preview",
                "--view", "tree",
                "--language", "en") `
              -TimeoutMilliseconds 150000 `
              -OnTimeout { Get-DesktopTimeoutDiagnostics }
            if ($open.Stdout.Trim() -ne (Resolve-Path $projectDirectory).Path) {
              throw "Desktop open did not print the accepted project path. StdOut=$($open.Stdout)"
            }

            $list = Invoke-DevProjexProcess -Arguments @("ui", "list", "--format", "json", "--language", "en")
            $instances = @(($list.Stdout | ConvertFrom-Json).instances)
            $matches = @(
              $instances |
                Where-Object {
                  [IO.Path]::GetFullPath([string]$_.projectPath) -eq $expectedProjectPath
                })
            if ($matches.Count -ne 1) {
              throw "Expected one desktop instance for the smoke project, found $($matches.Count)."
            }

            $desktopProcessId = [int]$matches[0].processId
            $instanceId = [string]$matches[0].instanceId
            $status = Invoke-DevProjexProcess -Arguments @(
              "ui", "status",
              "--instance", $instanceId,
              "--language", "en")
            $statusResponse = $status.Stdout | ConvertFrom-Json
            if (-not $statusResponse.ok -or $null -eq $statusResponse.state) {
              throw "Desktop status returned an unsuccessful response. Response=$($status.Stdout)"
            }
            $state = $statusResponse.state
            if (-not $state.startupReady -or
                -not $state.projectLoaded -or
                -not $state.previewOpen -or
                $state.previewView -ne "tree") {
              throw "Desktop did not apply the complete open --wait request. State=$($status.Stdout)"
            }

            Invoke-DevProjexProcess -Arguments @(
              "ui", "preview", "close",
              "--instance", $instanceId,
              "--language", "en") | Out-Null
          }
          finally {
            if ($null -eq $desktopProcessId) {
              try {
                $cleanupList = Invoke-DevProjexProcess -Arguments @("ui", "list", "--format", "json", "--language", "en")
                $cleanupInstances = @(($cleanupList.Stdout | ConvertFrom-Json).instances)
                $cleanupMatch = @(
                  $cleanupInstances |
                    Where-Object {
                      [IO.Path]::GetFullPath([string]$_.projectPath) -eq $expectedProjectPath
                    } |
                    Select-Object -First 1)
                if ($cleanupMatch.Count -eq 1) {
                  $desktopProcessId = [int]$cleanupMatch[0].processId
                }
              }
              catch {
                Write-Warning "Could not resolve the desktop PID during failure cleanup: $($_.Exception.Message)"
              }
            }

            if ($null -ne $desktopProcessId) {
              $desktopProcess = Get-Process -Id $desktopProcessId -ErrorAction SilentlyContinue
              if ($null -ne $desktopProcess) {
                try {
                  if ((Resolve-Path $desktopProcess.Path).Path -ne $exePath) {
                    throw "Refusing to stop an unexpected process: $($desktopProcess.Path)"
                  }

                  $desktopProcess.Kill($true)
                  if (-not $desktopProcess.WaitForExit(5000)) {
                    throw "Desktop process $desktopProcessId did not terminate after tree kill."
                  }
                }
                finally {
                  $desktopProcess.Dispose()
                }
              }
            }

            $finalList = Invoke-DevProjexProcess -Arguments @("ui", "list", "--format", "json", "--language", "en")
            $remainingInstances = @(($finalList.Stdout | ConvertFrom-Json).instances)
            $remainingMatch = @(
              $remainingInstances |
                Where-Object {
                  ($null -ne $desktopProcessId -and [int]$_.processId -eq $desktopProcessId) -or
                  ($null -ne $instanceId -and [string]$_.instanceId -eq $instanceId) -or
                  [IO.Path]::GetFullPath([string]$_.projectPath) -eq $expectedProjectPath
                })
            if ($remainingMatch.Count -ne 0) {
              throw "Desktop registry retained the terminated smoke instance. Response=$($finalList.Stdout)"
            }
          }

          Write-Host "Desktop IPC and redirected EOF smoke passed for ${{ matrix.rid }}."

      - name: PATH Wrapper Smoke (Unix)
        if: ${{ startsWith(matrix.rid, 'win-') == false }}
        shell: pwsh
        run: |
          $exePath = (Resolve-Path "artifacts/publish/${{ matrix.rid }}/${{ matrix.binary }}").Path
          $buildProps = [xml](Get-Content -Raw -Path "Directory.Build.props")
          $expectedVersionNode = $buildProps.SelectSingleNode("/Project/PropertyGroup/DevProjexVersion")
          if ($null -eq $expectedVersionNode -or [string]::IsNullOrWhiteSpace($expectedVersionNode.InnerText)) {
            throw "DevProjexVersion was not found in Directory.Build.props."
          }

          $expectedVersion = $expectedVersionNode.InnerText.Trim()
          chmod +x $exePath

          $binDirectory = Join-Path $env:RUNNER_TEMP "devprojex-path-bin-${{ matrix.rid }}"
          $workDirectory = Join-Path $env:RUNNER_TEMP "devprojex-path-work-${{ matrix.rid }}"
          $projectDirectory = Join-Path $env:RUNNER_TEMP "devprojex-path-project-${{ matrix.rid }}"
          $sourceDirectory = Join-Path $projectDirectory "src"
          New-Item -ItemType Directory -Force -Path $binDirectory, $workDirectory, $sourceDirectory | Out-Null

          $wrapperPath = Join-Path $binDirectory "devprojex"

          function ConvertTo-PosixSingleQuoted {
            param([Parameter(Mandatory = $true)][string] $Value)
            # POSIX sh escapes a single quote by closing the quoted string, emitting "'", and reopening it.
            $escapedSingleQuote = '''"''"'''
            return "'" + $Value.Replace("'", $escapedSingleQuote) + "'"
          }

          @(
            "#!/bin/sh",
            "# DevProjex terminal command wrapper",
            "# target: $exePath",
            "export DEVPROJEX_TERMINAL_HOST=1",
            ("exec " + (ConvertTo-PosixSingleQuoted $exePath) + " " + '"$@"')
          ) | Set-Content -LiteralPath $wrapperPath -Encoding utf8NoBOM
          chmod +x $wrapperPath

          "class App {}" | Set-Content -LiteralPath (Join-Path $sourceDirectory "App.cs") -Encoding utf8NoBOM

          function Invoke-DevProjexPathCommand {
            param(
              [Parameter(Mandatory = $true)]
              [string] $Name,
              [Parameter(Mandatory = $true)]
              [string[]] $Arguments
            )

            $stdoutPath = Join-Path $env:RUNNER_TEMP "devprojex-path-$Name-stdout.txt"
            $stderrPath = Join-Path $env:RUNNER_TEMP "devprojex-path-$Name-stderr.txt"
            Remove-Item -LiteralPath $stdoutPath, $stderrPath -ErrorAction SilentlyContinue

            Push-Location $workDirectory
            try {
              & devprojex @Arguments > $stdoutPath 2> $stderrPath
              $exitCode = $LASTEXITCODE
            }
            finally {
              Pop-Location
            }

            $stdout = Get-Content -Raw -Path $stdoutPath -ErrorAction SilentlyContinue
            $stderr = Get-Content -Raw -Path $stderrPath -ErrorAction SilentlyContinue

            if ($exitCode -ne 0) {
              throw "PATH wrapper command '$Name' failed for ${{ matrix.rid }}. ExitCode=$exitCode. Args=$($Arguments -join ' '). StdErr=$stderr"
            }

            if (-not [string]::IsNullOrWhiteSpace($stderr)) {
              throw "PATH wrapper command '$Name' wrote unexpected stderr for ${{ matrix.rid }}. StdErr=$stderr"
            }

            if ($null -eq $stdout) {
              return ""
            }

            return $stdout
          }

          $previousPath = $env:PATH
          $env:PATH = "$binDirectory$([IO.Path]::PathSeparator)$previousPath"
          try {
            $resolvedCommand = (Get-Command "devprojex" -CommandType Application).Source
            if ((Resolve-Path $resolvedCommand).Path -ne (Resolve-Path $wrapperPath).Path) {
              throw "PATH did not resolve devprojex to the generated wrapper. Resolved=$resolvedCommand Expected=$wrapperPath"
            }

            foreach ($helpArgument in @("--help", "-h", "/?")) {
              $stdout = Invoke-DevProjexPathCommand -Name "help-$($helpArgument -replace '[^A-Za-z0-9]+', '_')" -Arguments @($helpArgument, "--language", "en")
              if ($stdout -notmatch "(?m)^USAGE\r?$") {
                throw "PATH wrapper $helpArgument did not print usage text for ${{ matrix.rid }}. StdOut=$stdout"
              }
            }

            $versionOutput = Invoke-DevProjexPathCommand -Name "version" -Arguments @("--version")
            $actualPathVersion = $versionOutput.Trim()
            if ($actualPathVersion -ne $expectedVersion) {
              throw "PATH wrapper --version printed '$actualPathVersion' for ${{ matrix.rid }}, expected '$expectedVersion'."
            }

            $reportOutput = Invoke-DevProjexPathCommand -Name "analyze-json-stdout" -Arguments @(
              "analyze", $projectDirectory,
              "--format", "json",
              "--output", "-",
              "--root", "src",
              "--extension", "cs",
              "--git-mode", "none",
              "--exclude", "none",
              "--language", "en")

            if ($reportOutput -notmatch '"schemaVersion"' -or
                $reportOutput -notmatch '"kind": "devprojex-analysis"' -or
                $reportOutput -notmatch '"root"') {
              throw "PATH wrapper headless report did not print the expected JSON contract for ${{ matrix.rid }}. StdOut=$reportOutput"
            }

            $exportTreeOutput = Invoke-DevProjexPathCommand -Name "export-tree-stdout" -Arguments @(
              "export", "context", $projectDirectory,
              "--view", "tree",
              "--format", "json",
              "--output", "-",
              "--root", "src",
              "--extension", "cs",
              "--git-mode", "none",
              "--exclude", "none",
              "--language", "en")

            if ($exportTreeOutput -notmatch '"kind": "devprojex-context"' -or $exportTreeOutput -notmatch "App\.cs") {
              throw "PATH wrapper export JSON tree did not print the expected payload for ${{ matrix.rid }}. StdOut=$exportTreeOutput"
            }

            $exportFilePath = Join-Path $workDirectory "context.txt"
            $exportFileOutput = Invoke-DevProjexPathCommand -Name "export-tree-content-file" -Arguments @(
              "export", "context", $projectDirectory,
              "--view", "tree-content",
              "--format", "text",
              "--output", $exportFilePath,
              "--root", "src",
              "--extension", "cs",
              "--git-mode", "none",
              "--exclude", "none",
              "--language", "en")

            $expectedPathExportPath = (Resolve-Path $exportFilePath).Path
            $actualPathExportPath = $exportFileOutput.Trim()
            if ($actualPathExportPath -ne $expectedPathExportPath) {
              throw "PATH wrapper export file did not print the expected output path for ${{ matrix.rid }}. StdOut=$actualPathExportPath Expected=$expectedPathExportPath"
            }

            $exportFileContent = Get-Content -Raw -Path $exportFilePath -ErrorAction SilentlyContinue
            if ($exportFileContent -notmatch "App\.cs" -or $exportFileContent -notmatch "class App") {
              throw "PATH wrapper export file did not contain the expected tree-content payload for ${{ matrix.rid }}. Content=$exportFileContent"
            }
          }
          finally {
            $env:PATH = $previousPath
          }

          Write-Host "PATH wrapper smoke passed for ${{ matrix.rid }}."

      - name: Portable Launcher Smoke (Windows)
        if: ${{ startsWith(matrix.rid, 'win-') }}
        shell: pwsh
        run: |
          $exePath = (Resolve-Path "artifacts/publish/${{ matrix.rid }}/${{ matrix.binary }}").Path
          $buildProps = [xml](Get-Content -Raw -Path "Directory.Build.props")
          $expectedVersionNode = $buildProps.SelectSingleNode("/Project/PropertyGroup/DevProjexVersion")
          if ($null -eq $expectedVersionNode -or [string]::IsNullOrWhiteSpace($expectedVersionNode.InnerText)) {
            throw "DevProjexVersion was not found in Directory.Build.props."
          }

          $expectedVersion = $expectedVersionNode.InnerText.Trim()
          $launcherRoot = Join-Path $env:RUNNER_TEMP "devprojex-official-launcher-${{ matrix.rid }}"
          Remove-Item -LiteralPath $launcherRoot -Recurse -Force -ErrorAction SilentlyContinue
          $env:DEVPROJEX_RELEASE_WINDOWS_LAUNCHER_TARGET = $exePath
          $env:DEVPROJEX_RELEASE_WINDOWS_LAUNCHER_LOCAL_APP_DATA = $launcherRoot
          try {
            dotnet test Tests/DevProjex.Tests.Integration/DevProjex.Tests.Integration.csproj `
              -c Release `
              --no-restore `
              --filter "FullyQualifiedName~TerminalCommandSetupCrossPlatformIntegrationTests.InstallOrRepair_ReleaseGateEnvironment_InstallsOfficialWindowsLauncherThroughPublicApi" `
              --logger "console;verbosity=minimal"
            if ($LASTEXITCODE -ne 0) {
              throw "Production terminal launcher installation failed for ${{ matrix.rid }}."
            }
          }
          finally {
            Remove-Item Env:DEVPROJEX_RELEASE_WINDOWS_LAUNCHER_TARGET -ErrorAction SilentlyContinue
            Remove-Item Env:DEVPROJEX_RELEASE_WINDOWS_LAUNCHER_LOCAL_APP_DATA -ErrorAction SilentlyContinue
          }

          $launcherPath = [IO.Path]::Combine(
            $launcherRoot,
            "DevProjex",
            "bin",
            "devprojex.cmd")
          if (-not (Test-Path -LiteralPath $launcherPath -PathType Leaf)) {
            throw "Production terminal launcher was not installed: $launcherPath"
          }
          $stdoutPath = Join-Path $env:RUNNER_TEMP "devprojex-launcher-help-stdout.txt"
          $stderrPath = Join-Path $env:RUNNER_TEMP "devprojex-launcher-help-stderr.txt"

          foreach ($helpArgument in @("--help", "-h", "/?")) {
            Remove-Item -LiteralPath $stdoutPath, $stderrPath -ErrorAction SilentlyContinue
            $cmdArguments = @("/d", "/c", "`"$launcherPath`"", $helpArgument, "--language", "en")
            $process = Start-Process `
              -FilePath "cmd.exe" `
              -ArgumentList $cmdArguments `
              -RedirectStandardOutput $stdoutPath `
              -RedirectStandardError $stderrPath `
              -NoNewWindow `
              -Wait `
              -PassThru

            $stdout = Get-Content -Raw -Path $stdoutPath -ErrorAction SilentlyContinue
            $stderr = Get-Content -Raw -Path $stderrPath -ErrorAction SilentlyContinue

            if ($process.ExitCode -ne 0) {
              throw "Portable launcher $helpArgument smoke failed for ${{ matrix.rid }}. ExitCode=$($process.ExitCode). StdErr=$stderr"
            }

            if ($stdout -notmatch "(?m)^USAGE\r?$") {
              throw "Portable launcher $helpArgument smoke did not print usage text for ${{ matrix.rid }}. StdOut=$stdout StdErr=$stderr"
            }
          }

          Remove-Item -LiteralPath $stdoutPath, $stderrPath -ErrorAction SilentlyContinue
          $versionArguments = @("/d", "/c", "`"$launcherPath`"", "--version")
          $process = Start-Process `
            -FilePath "cmd.exe" `
            -ArgumentList $versionArguments `
            -RedirectStandardOutput $stdoutPath `
            -RedirectStandardError $stderrPath `
            -NoNewWindow `
            -Wait `
            -PassThru

          $stdout = Get-Content -Raw -Path $stdoutPath -ErrorAction SilentlyContinue
          $stderr = Get-Content -Raw -Path $stderrPath -ErrorAction SilentlyContinue

          if ($process.ExitCode -ne 0) {
            throw "Portable launcher --version smoke failed for ${{ matrix.rid }}. ExitCode=$($process.ExitCode). StdErr=$stderr"
          }

          if (-not [string]::IsNullOrWhiteSpace($stderr)) {
            throw "Portable launcher --version smoke wrote unexpected stderr for ${{ matrix.rid }}. StdErr=$stderr"
          }

          $actualVersion = if ($null -eq $stdout) { "" } else { $stdout.Trim() }
          if ($actualVersion -ne $expectedVersion) {
            throw "Portable launcher --version printed '$actualVersion' for ${{ matrix.rid }}, expected '$expectedVersion'. StdErr=$stderr"
          }

          Remove-Item -LiteralPath $stdoutPath, $stderrPath -ErrorAction SilentlyContinue
          $usageArguments = @(
            "/d", "/c", "`"$launcherPath`"",
            "doctor", "--format", "invalid", "--language", "en")
          $process = Start-Process `
            -FilePath "cmd.exe" `
            -ArgumentList $usageArguments `
            -RedirectStandardOutput $stdoutPath `
            -RedirectStandardError $stderrPath `
            -NoNewWindow `
            -Wait `
            -PassThru
          $stdout = Get-Content -Raw -Path $stdoutPath -ErrorAction SilentlyContinue
          $stderr = Get-Content -Raw -Path $stderrPath -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 2 -or
              -not [string]::IsNullOrEmpty($stdout) -or
              [string]::IsNullOrWhiteSpace($stderr)) {
            throw "Portable launcher did not preserve the real CLI usage-error contract. ExitCode=$($process.ExitCode). StdOut=$stdout StdErr=$stderr"
          }

          $projectDirectory = Join-Path $env:RUNNER_TEMP "devprojex-launcher-export-project-${{ matrix.rid }}"
          $sourceDirectory = Join-Path $projectDirectory "src"
          New-Item -ItemType Directory -Force -Path $sourceDirectory | Out-Null
          "class App {}" | Set-Content -LiteralPath (Join-Path $sourceDirectory "App.cs") -Encoding utf8NoBOM

          $exportPath = Join-Path $env:RUNNER_TEMP "devprojex-launcher-context.txt"
          Remove-Item -LiteralPath $stdoutPath, $stderrPath, $exportPath -ErrorAction SilentlyContinue
          $cmdArguments = @(
            "/d", "/c", "`"$launcherPath`"",
            "export", "context", $projectDirectory,
            "--view", "tree-content",
            "--format", "text",
            "--output", $exportPath,
            "--root", "src",
            "--extension", "cs",
            "--git-mode", "none",
            "--exclude", "none",
            "--language", "en")
          $process = Start-Process `
            -FilePath "cmd.exe" `
            -ArgumentList $cmdArguments `
            -RedirectStandardOutput $stdoutPath `
            -RedirectStandardError $stderrPath `
            -NoNewWindow `
            -Wait `
            -PassThru

          $stdout = Get-Content -Raw -Path $stdoutPath -ErrorAction SilentlyContinue
          $stderr = Get-Content -Raw -Path $stderrPath -ErrorAction SilentlyContinue

          if ($process.ExitCode -ne 0) {
            throw "Portable launcher export smoke failed for ${{ matrix.rid }}. ExitCode=$($process.ExitCode). StdErr=$stderr"
          }

          if (-not [string]::IsNullOrWhiteSpace($stderr)) {
            throw "Portable launcher export smoke wrote unexpected stderr for ${{ matrix.rid }}. StdErr=$stderr"
          }

          $expectedExportPath = (Resolve-Path $exportPath).Path
          $actualExportPath = if ($null -eq $stdout) { "" } else { $stdout.Trim() }
          if ($actualExportPath -ne $expectedExportPath) {
            throw "Portable launcher export smoke did not print the expected output path for ${{ matrix.rid }}. StdOut=$actualExportPath Expected=$expectedExportPath"
          }

          $exportContent = Get-Content -Raw -Path $exportPath -ErrorAction SilentlyContinue
          if ($exportContent -notmatch "App\.cs" -or $exportContent -notmatch "class App") {
            throw "Portable launcher export smoke did not write the expected tree-content payload for ${{ matrix.rid }}. Content=$exportContent"
          }

          Write-Host "Portable launcher smoke passed for ${{ matrix.rid }}."

      - name: Portable Launcher ConPTY TUI Smoke (Windows)
        if: ${{ startsWith(matrix.rid, 'win-') }}
        env:
          DEVPROJEX_SKIP_TUI_PTY_TESTS: 0
        shell: pwsh
        run: |
          $launcherRoot = Join-Path $env:RUNNER_TEMP "devprojex-official-launcher-${{ matrix.rid }}"
          $launcherPath = [IO.Path]::Combine(
            $launcherRoot,
            "DevProjex",
            "bin",
            "devprojex.cmd")
          if (-not (Test-Path -LiteralPath $launcherPath -PathType Leaf)) {
            throw "Production terminal launcher was not installed: $launcherPath"
          }

          $env:DEVPROJEX_TUI_TEST_BINARY = $launcherPath
          $filter = @(
            "FullyQualifiedName~TerminalPtyJourneyTests.OpenCurrentProjectFromWelcomeReachesWorkspaceAndStaysAlive",
            "FullyQualifiedName~TerminalPtyLifecycleTests.SupportedTerminalSizeMatrixRemainsKeyboardUsableAndWithinViewport",
            "FullyQualifiedName~TerminalPtyLifecycleTests.ScreenModesExitExplicitlyAndRestoreTerminalState",
            "FullyQualifiedName~TerminalPtyLifecycleTests.TooSmallTerminalRecoversAfterResizeWithoutRestarting",
            "FullyQualifiedName~TerminalPtyLifecycleTests.ExplicitMouseModeEnablesTrackingAndRestoresItOnExit",
            "FullyQualifiedName~TerminalPtyLifecycleTests.ExplicitNoMouseModeIgnoresMouseInput",
            "FullyQualifiedName~TerminalPlainPtyTests.PlainWorkspaceIsStableKeyboardAccessibleAndRestoresTerminal",
            "FullyQualifiedName~TerminalWorkspaceCommandLinePtyTests.CopyThenCjkLanguageSwitchKeepsThePublishedWorkspaceInteractive"
          ) -join "|"
          dotnet test Tests/DevProjex.Tests.Terminal/DevProjex.Tests.Terminal.csproj `
            -c Release `
            --no-restore `
            --filter $filter `
            --logger "console;verbosity=minimal"

      - name: Published Native PTY TUI Smoke (Unix)
        if: ${{ startsWith(matrix.rid, 'linux-') || startsWith(matrix.rid, 'osx-') }}
        env:
          DEVPROJEX_SKIP_TUI_PTY_TESTS: 0
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -eq "macOS") {
            # Keep the test host and forkpty child on one non-symlinked temp path.
            $nativePtyTemp = Join-Path $env:RUNNER_TEMP "devprojex-native-pty-${{ matrix.rid }}"
            New-Item -ItemType Directory -Path $nativePtyTemp -Force | Out-Null
            $env:TMPDIR = $nativePtyTemp + [IO.Path]::DirectorySeparatorChar
          }

          $binaryPath = (Resolve-Path "artifacts/publish/${{ matrix.rid }}/${{ matrix.binary }}").Path
          $env:DEVPROJEX_TUI_TEST_BINARY = $binaryPath
          $env:DEVPROJEX_TUI_TEST_REPOSITORY_ROOT = (Resolve-Path ".").Path
          $filter = @(
            "FullyQualifiedName~TerminalPtyJourneyTests.OpenCurrentProjectFromWelcomeReachesWorkspaceAndStaysAlive",
            "FullyQualifiedName~TerminalPtyJourneyTests.DynamicTerminalIdentityPreservesLiteralUnderscores",
            "FullyQualifiedName~TerminalPreviewNavigationPtyTests.PreviewViewportAndFocusSurviveKeyboardNavigationOverlaysAndResize",
            "FullyQualifiedName~TerminalRecentRepositoriesPtyTests.PopulatedCachedRepositoryOpensOfflineWithCleanIdentity",
            "FullyQualifiedName~TerminalClonePtyTests.LocalRepositoryCloneThroughApplicationBinaryOpensWorkspaceAndPreservesSource",
            "FullyQualifiedName~TerminalClonePtyTests.SshCloneCannotPromptThroughTheParentPty",
            "FullyQualifiedName~TerminalLargePreviewPtyTests.FileBackedPreviewReachesFirstMiddleAndFinalSectionsWithDistinctScrollbars",
            "FullyQualifiedName~TerminalPtyLifecycleTests.SupportedTerminalSizeMatrixRemainsKeyboardUsableAndWithinViewport",
            "FullyQualifiedName~TerminalPtyLifecycleTests.ScreenModesExitExplicitlyAndRestoreTerminalState",
            "FullyQualifiedName~TerminalPtyLifecycleTests.TooSmallTerminalRecoversAfterResizeWithoutRestarting",
            "FullyQualifiedName~TerminalPtyLifecycleTests.ExplicitMouseModeEnablesTrackingAndRestoresItOnExit",
            "FullyQualifiedName~TerminalPtyLifecycleTests.ExplicitNoMouseModeIgnoresMouseInput",
            "FullyQualifiedName~TerminalPlainPtyTests.PlainWorkspaceIsStableKeyboardAccessibleAndRestoresTerminal",
            "FullyQualifiedName~TerminalWorkspaceCommandLinePtyTests.CopyThenCjkLanguageSwitchKeepsThePublishedWorkspaceInteractive",
            "FullyQualifiedName~TerminalSignalProcessRegressionTests"
          ) -join "|"
          dotnet test Tests/DevProjex.Tests.Terminal/DevProjex.Tests.Terminal.csproj `
            -c Release `
            --no-restore `
            --filter $filter `
            --logger "console;verbosity=minimal"

  release-local-channel-gate:
    name: Local Release Channel Gate (Windows)
    needs:
      - plan-release
      - validate-release-config
    if: ${{ needs.plan-release.outputs.run_release == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and gate representative local release channels
        shell: pwsh
        run: |
          ./Scripts/release-all.ps1 `
            -Channels github `
            -Rids win-x64,linux-x64 `
            -SkipWack `
            -NonInteractive
          . ./Scripts/release-helpers.ps1
          $version = (Get-DefaultReleaseVersionInfo -repoRoot (Resolve-Path '.').Path).DisplayVersion
          ./Scripts/Test-ReleaseArtifacts.ps1 `
            -PublishRoot publish `
            -Version $version `
            -Channels github `
            -Rids win-x64,linux-x64
          ./Scripts/Test-ReleaseArtifactGateMutation.ps1 `
            -PublishRoot publish `
            -Version $version `
            -Channels github `
            -Rids win-x64,linux-x64

  release-gate:
    name: Release Gate
    needs:
      - plan-release
      - validate-release-config
      - prepare-publish-matrix
      - publish-smoke
      - release-local-channel-gate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify selected release jobs
        shell: pwsh
        env:
          PLAN_RESULT: ${{ needs.plan-release.result }}
          CONFIG_RESULT: ${{ needs.validate-release-config.result }}
          MATRIX_RESULT: ${{ needs.prepare-publish-matrix.result }}
          PUBLISH_RESULT: ${{ needs.publish-smoke.result }}
          LOCAL_CHANNEL_RESULT: ${{ needs.release-local-channel-gate.result }}
        run: |
          $results = @{
            plan = $env:PLAN_RESULT
            config = $env:CONFIG_RESULT
            matrix = $env:MATRIX_RESULT
            publish = $env:PUBLISH_RESULT
            local_channel = $env:LOCAL_CHANNEL_RESULT
          }
          $failed = @($results.GetEnumerator() | Where-Object { $_.Value -notin @('success', 'skipped') })
          if ($failed.Count -gt 0) {
            throw "Selected release jobs failed: $($failed.ForEach({ \"$($_.Key)=$($_.Value)\" }) -join ', ')"
          }

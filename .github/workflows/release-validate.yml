name: Release Validation

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master", "v4.9.5" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

concurrency:
  group: release-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-release-config:
    name: Validate Release Config
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Validate release metadata and Store alias contract
        shell: pwsh
        run: ./Scripts/release-all.ps1 -ValidateConfigOnly

  prepare-publish-matrix:
    name: Prepare Publish Matrix
    needs: validate-release-config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Select publish smoke matrix
        id: set-matrix
        shell: pwsh
        run: |
          $matrix = @{
            include = @(
              @{ runner = 'windows-latest'; rid = 'win-x64'; binary = 'DevProjex.exe' },
              @{ runner = 'windows-11-arm'; rid = 'win-arm64'; binary = 'DevProjex.exe' },
              @{ runner = 'ubuntu-latest'; rid = 'linux-x64'; binary = 'DevProjex' },
              @{ runner = 'ubuntu-24.04-arm'; rid = 'linux-arm64'; binary = 'DevProjex' },
              @{ runner = 'macos-15-intel'; rid = 'osx-x64'; binary = 'DevProjex' },
              # Keep native PTY validation on a stable GA image instead of a moving latest alias.
              @{ runner = 'macos-15'; rid = 'osx-arm64'; binary = 'DevProjex' }
            )
          }

          "matrix=$($matrix | ConvertTo-Json -Compress -Depth 4)" >> $env:GITHUB_OUTPUT

  publish-smoke:
    name: Publish Smoke (${{ matrix.rid }})
    needs: prepare-publish-matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-publish-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Linux UI smoke dependencies
        if: ${{ startsWith(matrix.rid, 'linux-') }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        shell: pwsh
        run: dotnet restore DevProjex.sln

      - name: Validate Linux DBus Dependency Graph
        if: ${{ startsWith(matrix.rid, 'linux-') }}
        shell: pwsh
        run: |
          $packageFiles = Get-ChildItem -Path "." -Recurse -Include "*.csproj", "*.props", "*.targets" -File |
            Where-Object { $_.FullName -notmatch "[\\/](bin|obj)[\\/]" }
          $directTmdsOverrides = @(
            foreach ($packageFile in $packageFiles) {
              [xml]$packageXml = Get-Content -Raw -Path $packageFile.FullName
              foreach ($item in $packageXml.SelectNodes("//*[local-name()='PackageReference' or local-name()='PackageVersion']")) {
                if ($item.Include -eq "Tmds.DBus.Protocol") {
                  Resolve-Path -Relative $packageFile.FullName
                }
              }
            }
          )

          if ($directTmdsOverrides.Count -gt 0) {
            throw "Do not override Tmds.DBus.Protocol directly. Avalonia.FreeDesktop owns the compatible DBus version. Overrides found in: $($directTmdsOverrides -join ', ')"
          }

          $assetsPath = "Apps/Avalonia/DevProjex.Avalonia/obj/project.assets.json"
          if (-not (Test-Path -LiteralPath $assetsPath)) {
            throw "Project assets file was not produced by restore: $assetsPath"
          }

          $assets = Get-Content -Raw -Path $assetsPath | ConvertFrom-Json
          $dbusLibraries = @(
            $assets.libraries.PSObject.Properties.Name |
              Where-Object { $_ -like "Tmds.DBus.Protocol/*" }
          )
          $freeDesktopLibraries = @(
            $assets.libraries.PSObject.Properties.Name |
              Where-Object { $_ -like "Avalonia.FreeDesktop/*" }
          )

          if ($freeDesktopLibraries.Count -ne 1) {
            throw "Expected exactly one Avalonia.FreeDesktop library in the restore graph, found $($freeDesktopLibraries.Count): $($freeDesktopLibraries -join ', ')"
          }

          if ($dbusLibraries.Count -ne 1) {
            throw "Expected exactly one Tmds.DBus.Protocol library in the restore graph, found $($dbusLibraries.Count): $($dbusLibraries -join ', ')"
          }

          $freeDesktopVersionText = $freeDesktopLibraries[0].Substring("Avalonia.FreeDesktop/".Length)
          $freeDesktopVersion = [Version]$freeDesktopVersionText
          if ($freeDesktopVersion -lt [Version]"12.1.0") {
            throw "Avalonia.FreeDesktop 12.1.0+ is required for the updated Tmds.DBus.Protocol API boundary. Resolved: $freeDesktopVersionText"
          }

          $versionText = $dbusLibraries[0].Substring("Tmds.DBus.Protocol/".Length)
          $version = [Version]$versionText
          if ($version -lt [Version]"0.94.0") {
            throw "Avalonia.FreeDesktop 12.1.0+ should resolve the updated Tmds.DBus.Protocol graph. Resolved: $versionText"
          }

      - name: Publish
        shell: pwsh
        # ReadyToRun validates the same startup-oriented publish shape as release artifacts.
        run: >
          dotnet publish Apps/Avalonia/DevProjex.Avalonia/DevProjex.Avalonia.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:PublishReadyToRun=true
          /p:PublishTrimmed=false
          /p:DebugType=None
          /p:DebugSymbols=false
          -o artifacts/publish/${{ matrix.rid }}

      - name: Validate Single-File Output
        shell: pwsh
        run: |
          $publishDirectory = "artifacts/publish/${{ matrix.rid }}"
          $files = @(Get-ChildItem -LiteralPath $publishDirectory -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne "${{ matrix.binary }}") {
            $actualFiles = $files.Name -join ", "
            throw "Expected exactly one published file named '${{ matrix.binary }}' for ${{ matrix.rid }}. Found: $actualFiles"
          }

      - name: Startup Smoke (Windows)
        if: ${{ startsWith(matrix.rid, 'win-') }}
        shell: pwsh
        run: |
          $exePath = (Resolve-Path "artifacts/publish/${{ matrix.rid }}/${{ matrix.binary }}").Path
          $workingDirectory = Split-Path -Path $exePath -Parent

          $process = Start-Process -FilePath $exePath -WorkingDirectory $workingDirectory -PassThru
          try {
            Start-Sleep -Seconds 5
            $process.Refresh()

            if ($process.HasExited) {
              throw "Published app exited too early during startup smoke. ExitCode=$($process.ExitCode)"
            }

            Write-Host "Startup smoke passed. Process stayed alive for 5 seconds."
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              $process.WaitForExit(5000) | Out-Null
            }
          }

      - name: Startup Smoke (Linux X11)
        if: ${{ startsWith(matrix.rid, 'linux-') }}
        shell: bash
        run: |
          set -euo pipefail
          exe_path="$(realpath "artifacts/publish/${{ matrix.rid }}/${{ matrix.binary }}")"
          work_dir="$(dirname "$exe_path")"
          chmod +x "$exe_path"

          xvfb-run -a bash -c '
            set -euo pipefail
            cd "$1"
            env -u CI "$2" &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            sleep 5

            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid"
              exit_code=$?
              echo "Published Linux app exited too early during X11 startup smoke. ExitCode=$exit_code"
              exit 1
            fi

            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          ' _ "$work_dir" "$exe_path"

          echo "Linux X11 startup smoke passed. Process stayed alive for 5 seconds."

      - name: Command-line Smoke (Native Published Artifact)
        shell: pwsh
        run: |
          $exePath = (Resolve-Path "artifacts/publish/${{ matrix.rid }}/${{ matrix.binary }}").Path
          $helpArguments = @("--help", "-h", "/?")
          $buildProps = [xml](Get-Content -Raw -Path "Directory.Build.props")
          $expectedVersionNode = $buildProps.SelectSingleNode("/Project/PropertyGroup/DevProjexVersion")
          if ($null -eq $expectedVersionNode -or [string]::IsNullOrWhiteSpace($expectedVersionNode.InnerText)) {
            throw "DevProjexVersion was not found in Directory.Build.props."
          }

          $expectedVersion = $expectedVersionNode.InnerText.Trim()

          if ($env:RUNNER_OS -ne "Windows") {
            chmod +x $exePath
          }

          foreach ($helpArgument in $helpArguments) {
            $safeName = $helpArgument -replace "[^A-Za-z0-9]+", "_"
            $stdoutPath = Join-Path $env:RUNNER_TEMP "devprojex-native-help-$safeName-stdout.txt"
            $stderrPath = Join-Path $env:RUNNER_TEMP "devprojex-native-help-$safeName-stderr.txt"

            Remove-Item -LiteralPath $stdoutPath, $stderrPath -ErrorAction SilentlyContinue

            if ($env:RUNNER_OS -eq "Windows") {
              $process = Start-Process `
                -FilePath $exePath `
                -ArgumentList @($helpArgument, "--language", "en") `
                -RedirectStandardOutput $stdoutPath `
                -RedirectStandardError $stderrPath `
                -NoNewWindow `
                -Wait `
                -PassThru
              $exitCode = $process.ExitCode
            }
            else {
              & $exePath $helpArgument "--language" "en" > $stdoutPath 2> $stderrPath
              $exitCode = $LASTEXITCODE
            }

            $stdout = Get-Content -Raw -Path $stdoutPath -ErrorAction SilentlyContinue
            $stderr = Get-Content -Raw -Path $stderrPath -ErrorAction SilentlyContinue

            if ($exitCode -ne 0) {
              throw "Published $helpArgument smoke failed for ${{ matrix.rid }}. ExitCode=$exitCode. StdErr=$stderr"
            }

            if ($stdout -notmatch "(?m)^USAGE\r?$") {
              throw "Published $helpArgument smoke did not print usage text for ${{ matrix.rid }}. StdOut=$stdout StdErr=$stderr"
            }
          }

          $versionStdoutPath = Join-Path $env:RUNNER_TEMP "devprojex-native-version-stdout.txt"
          $versionStderrPath = Join-Path $env:RUNNER_TEMP "devprojex-native-version-stderr.txt"
          Remove-Item -LiteralPath $versionStdoutPath, $versionStderrPath -ErrorAction SilentlyContinue

          if ($env:RUNNER_OS -eq "Windows") {
            $process = Start-Process `
              -FilePath $exePath `
              -ArgumentList @("--version") `
              -RedirectStandardOutput $versionStdoutPath `
              -RedirectStandardError $versionStderrPath `
              -NoNewWindow `
              -Wait `
              -PassThru
            $exitCode = $process.ExitCode
          }
          else {
            & $exePath "--version" > $versionStdoutPath 2> $versionStderrPath
            $exitCode = $LASTEXITCODE
          }

          $versionStdout = Get-Content -Raw -Path $versionStdoutPath -ErrorAction SilentlyContinue
          $versionStderr = Get-Content -Raw -Path $versionStderrPath -ErrorAction SilentlyContinue
          $actualVersion = if ($null -eq $versionStdout) { "" } else { $versionStdout.Trim() }

          if ($exitCode -ne 0) {
            throw "Published --version smoke failed for ${{ matrix.rid }}. ExitCode=$exitCode. StdErr=$versionStderr"
          }

          if (-not [string]::IsNullOrWhiteSpace($versionStderr)) {
            throw "Published --version smoke wrote unexpected stderr for ${{ matrix.rid }}. StdErr=$versionStderr"
          }

          if ($actualVersion -ne $expectedVersion) {
            throw "Published --version printed '$actualVersion' for ${{ matrix.rid }}, expected '$expectedVersion'."
          }

          $projectDirectory = Join-Path $env:RUNNER_TEMP "devprojex-native-export-project-${{ matrix.rid }}"
          $sourceDirectory = Join-Path $projectDirectory "src"
          New-Item -ItemType Directory -Force -Path $sourceDirectory | Out-Null
          "class App {}" | Set-Content -LiteralPath (Join-Path $sourceDirectory "App.cs") -Encoding utf8NoBOM

          $exportStdoutPath = Join-Path $env:RUNNER_TEMP "devprojex-native-export-stdout.txt"
          $exportStderrPath = Join-Path $env:RUNNER_TEMP "devprojex-native-export-stderr.txt"
          Remove-Item -LiteralPath $exportStdoutPath, $exportStderrPath -ErrorAction SilentlyContinue
          $exportArguments = @(
            "export", "context", $projectDirectory,
            "--view", "tree",
            "--format", "text",
            "--root", "src",
            "--extension", "cs",
            "--git-mode", "none",
            "--exclude", "none",
            "--language", "en",
            "-o", "-")

          if ($env:RUNNER_OS -eq "Windows") {
            $process = Start-Process `
              -FilePath $exePath `
              -ArgumentList $exportArguments `
              -RedirectStandardOutput $exportStdoutPath `
              -RedirectStandardError $exportStderrPath `
              -NoNewWindow `
              -Wait `
              -PassThru
            $exitCode = $process.ExitCode
          }
          else {
            & $exePath @exportArguments > $exportStdoutPath 2> $exportStderrPath
            $exitCode = $LASTEXITCODE
          }

          $exportStdout = Get-Content -Raw -Path $exportStdoutPath -ErrorAction SilentlyContinue
          $exportStderr = Get-Content -Raw -Path $exportStderrPath -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {
            throw "Published export smoke failed for ${{ matrix.rid }}. ExitCode=$exitCode. StdErr=$exportStderr"
          }

          if (-not [string]::IsNullOrWhiteSpace($exportStderr)) {
            throw "Published export smoke wrote unexpected stderr for ${{ matrix.rid }}. StdErr=$exportStderr"
          }

          if ($exportStdout -notmatch "App\.cs") {
            throw "Published export smoke did not print the expected tree for ${{ matrix.rid }}. StdOut=$exportStdout"
          }

          Write-Host "Command-line smoke passed for ${{ matrix.rid }}."

      - name: Desktop IPC and Redirected EOF Smoke (Windows)
        if: ${{ startsWith(matrix.rid, 'win-') }}
        shell: pwsh
        run: |
          $exePath = (Resolve-Path "artifacts/publish/${{ matrix.rid }}/${{ matrix.binary }}").Path
          $projectDirectory = Join-Path $env:RUNNER_TEMP "devprojex-desktop-ipc-${{ matrix.rid }}"
          New-Item -ItemType Directory -Force -Path $projectDirectory | Out-Null
          "class App {}" | Set-Content -LiteralPath (Join-Path $projectDirectory "App.cs") -Encoding utf8NoBOM

          function Invoke-DevProjexProcess {
            param(
              [Parameter(Mandatory = $true)]
              [string[]] $Arguments,
              [int] $TimeoutMilliseconds = 30000
            )

            $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = $exePath
            $startInfo.WorkingDirectory = $projectDirectory
            $startInfo.UseShellExecute = $false
            $startInfo.CreateNoWindow = $true
            $startInfo.RedirectStandardOutput = $true
            $startInfo.RedirectStandardError = $true
            foreach ($argument in $Arguments) {
              $startInfo.ArgumentList.Add($argument)
            }

            $process = [System.Diagnostics.Process]::Start($startInfo)
            $stdoutTask = $process.StandardOutput.ReadToEndAsync()
            $stderrTask = $process.StandardError.ReadToEndAsync()
            if (-not $process.WaitForExit($TimeoutMilliseconds)) {
              $process.Kill($true)
              throw "DevProjex command timed out: $($Arguments -join ' ')"
            }

            $outputTasks = [System.Threading.Tasks.Task]::WhenAll(
              [System.Threading.Tasks.Task[]]@($stdoutTask, $stderrTask))
            if (-not $outputTasks.Wait(5000)) {
              throw "A desktop child retained redirected CLI handles after exit: $($Arguments -join ' ')"
            }

            $stdout = $stdoutTask.GetAwaiter().GetResult()
            $stderr = $stderrTask.GetAwaiter().GetResult()
            if ($process.ExitCode -ne 0) {
              throw "DevProjex command failed. ExitCode=$($process.ExitCode). Args=$($Arguments -join ' '). StdErr=$stderr"
            }

            return [pscustomobject]@{
              Stdout = $stdout
              Stderr = $stderr
            }
          }

          $desktopProcessId = $null
          $instanceId = $null
          try {
            $open = Invoke-DevProjexProcess -Arguments @(
              "open", $projectDirectory,
              "--new-window",
              "--wait",
              "--preview",
              "--view", "tree",
              "--language", "en")
            if ($open.Stdout.Trim() -ne (Resolve-Path $projectDirectory).Path) {
              throw "Desktop open did not print the accepted project path. StdOut=$($open.Stdout)"
            }

            $list = Invoke-DevProjexProcess -Arguments @("ui", "list", "--format", "json", "--language", "en")
            $instances = @(($list.Stdout | ConvertFrom-Json).instances)
            $matches = @($instances | Where-Object { $_.projectPath -eq (Resolve-Path $projectDirectory).Path })
            if ($matches.Count -ne 1) {
              throw "Expected one desktop instance for the smoke project, found $($matches.Count)."
            }

            $desktopProcessId = [int]$matches[0].processId
            $instanceId = [string]$matches[0].instanceId
            $status = Invoke-DevProjexProcess -Arguments @(
              "ui", "status",
              "--instance", $instanceId,
              "--language", "en")
            $state = $status.Stdout | ConvertFrom-Json
            if (-not $state.startupReady -or
                -not $state.projectLoaded -or
                -not $state.previewOpen -or
                $state.previewView -ne "tree") {
              throw "Desktop did not apply the complete open --wait request. State=$($status.Stdout)"
            }

            Invoke-DevProjexProcess -Arguments @(
              "ui", "preview", "close",
              "--instance", $instanceId,
              "--language", "en") | Out-Null
          }
          finally {
            if ($null -eq $desktopProcessId) {
              try {
                $cleanupList = Invoke-DevProjexProcess -Arguments @("ui", "list", "--format", "json", "--language", "en")
                $cleanupInstances = @(($cleanupList.Stdout | ConvertFrom-Json).instances)
                $cleanupMatch = @(
                  $cleanupInstances |
                    Where-Object { $_.projectPath -eq (Resolve-Path $projectDirectory).Path } |
                    Select-Object -First 1)
                if ($cleanupMatch.Count -eq 1) {
                  $desktopProcessId = [int]$cleanupMatch[0].processId
                }
              }
              catch {
                Write-Warning "Could not resolve the desktop PID during failure cleanup: $($_.Exception.Message)"
              }
            }

            if ($null -ne $desktopProcessId) {
              $desktopProcess = Get-Process -Id $desktopProcessId -ErrorAction SilentlyContinue
              if ($null -ne $desktopProcess) {
                if ((Resolve-Path $desktopProcess.Path).Path -ne $exePath) {
                  throw "Refusing to stop an unexpected process: $($desktopProcess.Path)"
                }

                Stop-Process -Id $desktopProcessId -Force
                Start-Sleep -Milliseconds 500
              }
            }

            Invoke-DevProjexProcess -Arguments @("ui", "list", "--format", "json", "--language", "en") | Out-Null
          }

          Write-Host "Desktop IPC and redirected EOF smoke passed for ${{ matrix.rid }}."

      - name: PATH Wrapper Smoke (Unix)
        if: ${{ startsWith(matrix.rid, 'win-') == false }}
        shell: pwsh
        run: |
          $exePath = (Resolve-Path "artifacts/publish/${{ matrix.rid }}/${{ matrix.binary }}").Path
          $buildProps = [xml](Get-Content -Raw -Path "Directory.Build.props")
          $expectedVersionNode = $buildProps.SelectSingleNode("/Project/PropertyGroup/DevProjexVersion")
          if ($null -eq $expectedVersionNode -or [string]::IsNullOrWhiteSpace($expectedVersionNode.InnerText)) {
            throw "DevProjexVersion was not found in Directory.Build.props."
          }

          $expectedVersion = $expectedVersionNode.InnerText.Trim()
          chmod +x $exePath

          $binDirectory = Join-Path $env:RUNNER_TEMP "devprojex-path-bin-${{ matrix.rid }}"
          $workDirectory = Join-Path $env:RUNNER_TEMP "devprojex-path-work-${{ matrix.rid }}"
          $projectDirectory = Join-Path $env:RUNNER_TEMP "devprojex-path-project-${{ matrix.rid }}"
          $sourceDirectory = Join-Path $projectDirectory "src"
          New-Item -ItemType Directory -Force -Path $binDirectory, $workDirectory, $sourceDirectory | Out-Null

          $wrapperPath = Join-Path $binDirectory "devprojex"

          function ConvertTo-PosixSingleQuoted {
            param([Parameter(Mandatory = $true)][string] $Value)
            # POSIX sh escapes a single quote by closing the quoted string, emitting "'", and reopening it.
            $escapedSingleQuote = '''"''"'''
            return "'" + $Value.Replace("'", $escapedSingleQuote) + "'"
          }

          @(
            "#!/bin/sh",
            "# DevProjex terminal command wrapper",
            "# target: $exePath",
            "export DEVPROJEX_TERMINAL_HOST=1",
            ("exec " + (ConvertTo-PosixSingleQuoted $exePath) + " " + '"$@"')
          ) | Set-Content -LiteralPath $wrapperPath -Encoding utf8NoBOM
          chmod +x $wrapperPath

          "class App {}" | Set-Content -LiteralPath (Join-Path $sourceDirectory "App.cs") -Encoding utf8NoBOM

          function Invoke-DevProjexPathCommand {
            param(
              [Parameter(Mandatory = $true)]
              [string] $Name,
              [Parameter(Mandatory = $true)]
              [string[]] $Arguments
            )

            $stdoutPath = Join-Path $env:RUNNER_TEMP "devprojex-path-$Name-stdout.txt"
            $stderrPath = Join-Path $env:RUNNER_TEMP "devprojex-path-$Name-stderr.txt"
            Remove-Item -LiteralPath $stdoutPath, $stderrPath -ErrorAction SilentlyContinue

            Push-Location $workDirectory
            try {
              & devprojex @Arguments > $stdoutPath 2> $stderrPath
              $exitCode = $LASTEXITCODE
            }
            finally {
              Pop-Location
            }

            $stdout = Get-Content -Raw -Path $stdoutPath -ErrorAction SilentlyContinue
            $stderr = Get-Content -Raw -Path $stderrPath -ErrorAction SilentlyContinue

            if ($exitCode -ne 0) {
              throw "PATH wrapper command '$Name' failed for ${{ matrix.rid }}. ExitCode=$exitCode. Args=$($Arguments -join ' '). StdErr=$stderr"
            }

            if (-not [string]::IsNullOrWhiteSpace($stderr)) {
              throw "PATH wrapper command '$Name' wrote unexpected stderr for ${{ matrix.rid }}. StdErr=$stderr"
            }

            if ($null -eq $stdout) {
              return ""
            }

            return $stdout
          }

          $previousPath = $env:PATH
          $env:PATH = "$binDirectory$([IO.Path]::PathSeparator)$previousPath"
          try {
            $resolvedCommand = (Get-Command "devprojex" -CommandType Application).Source
            if ((Resolve-Path $resolvedCommand).Path -ne (Resolve-Path $wrapperPath).Path) {
              throw "PATH did not resolve devprojex to the generated wrapper. Resolved=$resolvedCommand Expected=$wrapperPath"
            }

            foreach ($helpArgument in @("--help", "-h", "/?")) {
              $stdout = Invoke-DevProjexPathCommand -Name "help-$($helpArgument -replace '[^A-Za-z0-9]+', '_')" -Arguments @($helpArgument, "--language", "en")
              if ($stdout -notmatch "(?m)^USAGE\r?$") {
                throw "PATH wrapper $helpArgument did not print usage text for ${{ matrix.rid }}. StdOut=$stdout"
              }
            }

            $versionOutput = Invoke-DevProjexPathCommand -Name "version" -Arguments @("--version")
            $actualPathVersion = $versionOutput.Trim()
            if ($actualPathVersion -ne $expectedVersion) {
              throw "PATH wrapper --version printed '$actualPathVersion' for ${{ matrix.rid }}, expected '$expectedVersion'."
            }

            $reportOutput = Invoke-DevProjexPathCommand -Name "analyze-json-stdout" -Arguments @(
              "analyze", $projectDirectory,
              "--format", "json",
              "--output", "-",
              "--root", "src",
              "--extension", "cs",
              "--git-mode", "none",
              "--exclude", "none",
              "--language", "en")

            if ($reportOutput -notmatch '"schemaVersion"' -or
                $reportOutput -notmatch '"kind": "devprojex-analysis"' -or
                $reportOutput -notmatch '"root"') {
              throw "PATH wrapper headless report did not print the expected JSON contract for ${{ matrix.rid }}. StdOut=$reportOutput"
            }

            $exportTreeOutput = Invoke-DevProjexPathCommand -Name "export-tree-stdout" -Arguments @(
              "export", "context", $projectDirectory,
              "--view", "tree",
              "--format", "json",
              "--output", "-",
              "--root", "src",
              "--extension", "cs",
              "--git-mode", "none",
              "--exclude", "none",
              "--language", "en")

            if ($exportTreeOutput -notmatch '"kind": "devprojex-context"' -or $exportTreeOutput -notmatch "App\.cs") {
              throw "PATH wrapper export JSON tree did not print the expected payload for ${{ matrix.rid }}. StdOut=$exportTreeOutput"
            }

            $exportFilePath = Join-Path $workDirectory "context.txt"
            $exportFileOutput = Invoke-DevProjexPathCommand -Name "export-tree-content-file" -Arguments @(
              "export", "context", $projectDirectory,
              "--view", "tree-content",
              "--format", "text",
              "--output", $exportFilePath,
              "--root", "src",
              "--extension", "cs",
              "--git-mode", "none",
              "--exclude", "none",
              "--language", "en")

            $expectedPathExportPath = (Resolve-Path $exportFilePath).Path
            $actualPathExportPath = $exportFileOutput.Trim()
            if ($actualPathExportPath -ne $expectedPathExportPath) {
              throw "PATH wrapper export file did not print the expected output path for ${{ matrix.rid }}. StdOut=$actualPathExportPath Expected=$expectedPathExportPath"
            }

            $exportFileContent = Get-Content -Raw -Path $exportFilePath -ErrorAction SilentlyContinue
            if ($exportFileContent -notmatch "App\.cs" -or $exportFileContent -notmatch "class App") {
              throw "PATH wrapper export file did not contain the expected tree-content payload for ${{ matrix.rid }}. Content=$exportFileContent"
            }
          }
          finally {
            $env:PATH = $previousPath
          }

          Write-Host "PATH wrapper smoke passed for ${{ matrix.rid }}."

      - name: Portable Launcher Smoke (Windows)
        if: ${{ startsWith(matrix.rid, 'win-') }}
        shell: pwsh
        run: |
          $exePath = (Resolve-Path "artifacts/publish/${{ matrix.rid }}/${{ matrix.binary }}").Path
          $buildProps = [xml](Get-Content -Raw -Path "Directory.Build.props")
          $expectedVersionNode = $buildProps.SelectSingleNode("/Project/PropertyGroup/DevProjexVersion")
          if ($null -eq $expectedVersionNode -or [string]::IsNullOrWhiteSpace($expectedVersionNode.InnerText)) {
            throw "DevProjexVersion was not found in Directory.Build.props."
          }

          $expectedVersion = $expectedVersionNode.InnerText.Trim()
          $launcherPath = Join-Path $env:RUNNER_TEMP "devprojex.cmd"
          $stdoutPath = Join-Path $env:RUNNER_TEMP "devprojex-launcher-help-stdout.txt"
          $stderrPath = Join-Path $env:RUNNER_TEMP "devprojex-launcher-help-stderr.txt"
          $dllPath = [System.IO.Path]::ChangeExtension([string]$exePath, ".dll")

          @(
            "@echo off",
            "rem DevProjex terminal command wrapper",
            "rem target: $exePath",
            "set `"DEVPROJEX_EXE=$exePath`"",
            "set `"DEVPROJEX_DLL=$dllPath`"",
            "set `"DEVPROJEX_TERMINAL_HOST=1`"",
            "if exist `"%DEVPROJEX_DLL%`" (",
            "  dotnet `"%DEVPROJEX_DLL%`" %*",
            "  exit /b %ERRORLEVEL%",
            ")",
            "`"%DEVPROJEX_EXE%`" %*",
            "exit /b %ERRORLEVEL%"
          ) | Set-Content -LiteralPath $launcherPath -Encoding ASCII

          foreach ($helpArgument in @("--help", "-h", "/?")) {
            Remove-Item -LiteralPath $stdoutPath, $stderrPath -ErrorAction SilentlyContinue
            $cmdArguments = @("/d", "/c", "`"$launcherPath`"", $helpArgument, "--language", "en")
            $process = Start-Process `
              -FilePath "cmd.exe" `
              -ArgumentList $cmdArguments `
              -RedirectStandardOutput $stdoutPath `
              -RedirectStandardError $stderrPath `
              -NoNewWindow `
              -Wait `
              -PassThru

            $stdout = Get-Content -Raw -Path $stdoutPath -ErrorAction SilentlyContinue
            $stderr = Get-Content -Raw -Path $stderrPath -ErrorAction SilentlyContinue

            if ($process.ExitCode -ne 0) {
              throw "Portable launcher $helpArgument smoke failed for ${{ matrix.rid }}. ExitCode=$($process.ExitCode). StdErr=$stderr"
            }

            if ($stdout -notmatch "(?m)^USAGE\r?$") {
              throw "Portable launcher $helpArgument smoke did not print usage text for ${{ matrix.rid }}. StdOut=$stdout StdErr=$stderr"
            }
          }

          Remove-Item -LiteralPath $stdoutPath, $stderrPath -ErrorAction SilentlyContinue
          $versionArguments = @("/d", "/c", "`"$launcherPath`"", "--version")
          $process = Start-Process `
            -FilePath "cmd.exe" `
            -ArgumentList $versionArguments `
            -RedirectStandardOutput $stdoutPath `
            -RedirectStandardError $stderrPath `
            -NoNewWindow `
            -Wait `
            -PassThru

          $stdout = Get-Content -Raw -Path $stdoutPath -ErrorAction SilentlyContinue
          $stderr = Get-Content -Raw -Path $stderrPath -ErrorAction SilentlyContinue

          if ($process.ExitCode -ne 0) {
            throw "Portable launcher --version smoke failed for ${{ matrix.rid }}. ExitCode=$($process.ExitCode). StdErr=$stderr"
          }

          if (-not [string]::IsNullOrWhiteSpace($stderr)) {
            throw "Portable launcher --version smoke wrote unexpected stderr for ${{ matrix.rid }}. StdErr=$stderr"
          }

          $actualVersion = if ($null -eq $stdout) { "" } else { $stdout.Trim() }
          if ($actualVersion -ne $expectedVersion) {
            throw "Portable launcher --version printed '$actualVersion' for ${{ matrix.rid }}, expected '$expectedVersion'. StdErr=$stderr"
          }

          $projectDirectory = Join-Path $env:RUNNER_TEMP "devprojex-launcher-export-project-${{ matrix.rid }}"
          $sourceDirectory = Join-Path $projectDirectory "src"
          New-Item -ItemType Directory -Force -Path $sourceDirectory | Out-Null
          "class App {}" | Set-Content -LiteralPath (Join-Path $sourceDirectory "App.cs") -Encoding utf8NoBOM

          $exportPath = Join-Path $env:RUNNER_TEMP "devprojex-launcher-context.txt"
          Remove-Item -LiteralPath $stdoutPath, $stderrPath, $exportPath -ErrorAction SilentlyContinue
          $cmdArguments = @(
            "/d", "/c", "`"$launcherPath`"",
            "export", "context", $projectDirectory,
            "--view", "tree-content",
            "--format", "text",
            "--output", $exportPath,
            "--root", "src",
            "--extension", "cs",
            "--git-mode", "none",
            "--exclude", "none",
            "--language", "en")
          $process = Start-Process `
            -FilePath "cmd.exe" `
            -ArgumentList $cmdArguments `
            -RedirectStandardOutput $stdoutPath `
            -RedirectStandardError $stderrPath `
            -NoNewWindow `
            -Wait `
            -PassThru

          $stdout = Get-Content -Raw -Path $stdoutPath -ErrorAction SilentlyContinue
          $stderr = Get-Content -Raw -Path $stderrPath -ErrorAction SilentlyContinue

          if ($process.ExitCode -ne 0) {
            throw "Portable launcher export smoke failed for ${{ matrix.rid }}. ExitCode=$($process.ExitCode). StdErr=$stderr"
          }

          if (-not [string]::IsNullOrWhiteSpace($stderr)) {
            throw "Portable launcher export smoke wrote unexpected stderr for ${{ matrix.rid }}. StdErr=$stderr"
          }

          $expectedExportPath = (Resolve-Path $exportPath).Path
          $actualExportPath = if ($null -eq $stdout) { "" } else { $stdout.Trim() }
          if ($actualExportPath -ne $expectedExportPath) {
            throw "Portable launcher export smoke did not print the expected output path for ${{ matrix.rid }}. StdOut=$actualExportPath Expected=$expectedExportPath"
          }

          $exportContent = Get-Content -Raw -Path $exportPath -ErrorAction SilentlyContinue
          if ($exportContent -notmatch "App\.cs" -or $exportContent -notmatch "class App") {
            throw "Portable launcher export smoke did not write the expected tree-content payload for ${{ matrix.rid }}. Content=$exportContent"
          }

          Write-Host "Portable launcher smoke passed for ${{ matrix.rid }}."

      - name: Portable Launcher ConPTY TUI Smoke (Windows x64)
        if: ${{ matrix.rid == 'win-x64' }}
        shell: pwsh
        run: |
          $launcherPath = Join-Path $env:RUNNER_TEMP "devprojex.cmd"
          if (-not (Test-Path -LiteralPath $launcherPath)) {
            throw "Portable launcher was not created: $launcherPath"
          }

          $env:DEVPROJEX_TUI_TEST_BINARY = $launcherPath
          dotnet test Tests/DevProjex.Tests.Terminal/DevProjex.Tests.Terminal.csproj `
            -c Release `
            --no-restore `
            --filter "FullyQualifiedName~TerminalPtyJourneyTests.OpenCurrentProjectFromWelcomeReachesWorkspaceAndStaysAlive" `
            --logger "console;verbosity=minimal"

      - name: Published Native PTY TUI Smoke (Unix)
        if: ${{ startsWith(matrix.rid, 'linux-') || startsWith(matrix.rid, 'osx-') }}
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -eq "macOS") {
            # Keep the test host and forkpty child on one non-symlinked temp path.
            $nativePtyTemp = Join-Path $env:RUNNER_TEMP "devprojex-native-pty-${{ matrix.rid }}"
            New-Item -ItemType Directory -Path $nativePtyTemp -Force | Out-Null
            $env:TMPDIR = $nativePtyTemp + [IO.Path]::DirectorySeparatorChar
          }

          $binaryPath = (Resolve-Path "artifacts/publish/${{ matrix.rid }}/${{ matrix.binary }}").Path
          $env:DEVPROJEX_TUI_TEST_BINARY = $binaryPath
          $env:DEVPROJEX_TUI_TEST_REPOSITORY_ROOT = (Resolve-Path ".").Path
          $filter = @(
            "FullyQualifiedName~TerminalPtyJourneyTests.OpenCurrentProjectFromWelcomeReachesWorkspaceAndStaysAlive",
            "FullyQualifiedName~TerminalPtyJourneyTests.DynamicTerminalIdentityPreservesLiteralUnderscores",
            "FullyQualifiedName~TerminalPreviewNavigationPtyTests.PreviewViewportAndFocusSurviveKeyboardNavigationOverlaysAndResize",
            "FullyQualifiedName~TerminalRecentRepositoriesPtyTests.PopulatedCachedRepositoryOpensOfflineWithCleanIdentity",
            "FullyQualifiedName~TerminalClonePtyTests.CloneProgressCancellationCleansCacheAndRetryOpensWorkspace",
            "FullyQualifiedName~TerminalLargePreviewPtyTests.FileBackedPreviewReachesFirstMiddleAndFinalSectionsWithDistinctScrollbars"
          ) -join "|"
          dotnet test Tests/DevProjex.Tests.Terminal/DevProjex.Tests.Terminal.csproj `
            -c Release `
            --no-restore `
            --filter $filter `
            --logger "console;verbosity=minimal"

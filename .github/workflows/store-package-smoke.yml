name: Store Package Smoke

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

concurrency:
  group: store-package-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan-store:
    name: Plan Store Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_store: ${{ steps.plan.outputs.run_store }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate CI planner contracts
        shell: pwsh
        run: ./Scripts/ci/Test-CiChangePlanner.ps1

      - name: Select Store validation plan
        id: plan
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIOUS_GATE_NAME: Store Gate
        run: >
          ./Scripts/ci/Select-CiPlan.ps1
          -GitHubEventPath $env:GITHUB_EVENT_PATH
          -GitHubEventName $env:GITHUB_EVENT_NAME
          -PreviousGateName $env:PREVIOUS_GATE_NAME
          -GitHubOutputPath $env:GITHUB_OUTPUT

  store-package-smoke:
    name: Store Package Smoke
    needs: plan-store
    if: ${{ needs.plan-store.outputs.run_store == 'true' }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build Store package and validate execution alias
        shell: pwsh
        run: ./Scripts/release-all.ps1 -SmokeStoreBuildOnly

  store-gate:
    name: Store Gate
    needs:
      - plan-store
      - store-package-smoke
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify selected Store jobs
        shell: pwsh
        env:
          PLAN_RESULT: ${{ needs.plan-store.result }}
          STORE_RESULT: ${{ needs.store-package-smoke.result }}
        run: |
          $results = @{
            plan = $env:PLAN_RESULT
            store = $env:STORE_RESULT
          }
          $failed = @($results.GetEnumerator() | Where-Object { $_.Value -notin @('success', 'skipped') })
          if ($failed.Count -gt 0) {
            throw "Selected Store jobs failed: $($failed.ForEach({ \"$($_.Key)=$($_.Value)\" }) -join ', ')"
          }

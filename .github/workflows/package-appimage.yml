---
name: Package AppImage

# CI tier 2 (push to v*) and 3 (master, release). Policy: .github/workflows/README.md
# - `pull_request` runs ONLY when the Linux packaging inputs themselves change (paths below).
#   Core code paths belong to `push`; copying them here makes every feature push build two
#   AppImages. `branches-ignore: [master]` keeps the release PR out: the push run on v* already
#   attaches its checks to the same commit the release PR shows. Never replace it with `branches:`.
# - The read-only build is appimage-build.yml (also used by release-candidate.yml). Only
#   release-upload may write, and only for `release: published` or an explicit release_tag.

on:
  push:
    branches: [master, 'v*']
    paths:
      - .github/workflows/package-appimage.yml
      - .github/workflows/appimage-build.yml
      - Apps/**
      - Application/**
      - Infrastructure/**
      - Kernel/**
      - Assets/AppIcon/Linux/png/**
      - Assets/Localization/**
      - Packaging/Linux/**
      - Scripts/Test-ReleaseArtifacts.ps1
      - Scripts/Test-ReleaseArtifactGateMutation.ps1
      - Scripts/ci/Test-ReleaseVersion.ps1
      - Directory.Build.props
      - Directory.Build.targets
      - Directory.Packages.props
  pull_request:
    # The release PR (v* -> master) is excluded: its head commit already carries the push run.
    branches-ignore: [master]
    paths:
      - .github/workflows/package-appimage.yml
      - .github/workflows/appimage-build.yml
      - Apps/Avalonia/Services/AvaloniaDeveloperCommandRunner.cs
      - Apps/Avalonia/Services/CommandLineBenchmarkRunner.cs
      - Apps/Terminal/DesktopControl/DesktopProcessLauncher.cs
      - Assets/AppIcon/Linux/png/**
      - Infrastructure/AppInstances/AppInstanceLauncher.cs
      - Infrastructure/TerminalCommands/TerminalCommandSetupService.cs
      - Kernel/ProcessEntryPointResolver.cs
      - Packaging/Linux/**
      - Scripts/Test-ReleaseArtifacts.ps1
      - Scripts/Test-ReleaseArtifactGateMutation.ps1
      - Scripts/ci/Test-ReleaseVersion.ps1
      - Directory.Build.targets
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        type: string
      release_tag:
        description: Existing GitHub release tag to receive the AppImages
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: read

# One run per pull request or branch head. Feature pushes and branch merges cancel their own
# superseded runs; release and dispatch runs are never cancelled.
concurrency:
  group: package-appimage-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  prepare:
    name: Resolve AppImage release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      upload_release: ${{ steps.metadata.outputs.upload_release }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}

    steps:
      - uses: actions/checkout@v7

      - name: Resolve version and release tag
        id: metadata
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
          PUBLISHED_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            version="${PUBLISHED_RELEASE_TAG#v}"
            release_tag="${PUBLISHED_RELEASE_TAG}"
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" || "${GITHUB_EVENT_NAME}" == "push" ]]; then
            # Validation-only runs (tiers 1 and 2) take the repository version and never upload.
            version="$(sed -n 's:.*<DevProjexVersion[^>]*>\([^<]*\)</DevProjexVersion>.*:\1:p' Directory.Build.props)"
            release_tag=""
          else
            version="${DISPATCH_VERSION}"
            release_tag="${DISPATCH_RELEASE_TAG}"
            if [[ "${version}" == v* ]]; then
              echo "::error::workflow_dispatch version must not start with v"
              exit 1
            fi
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+([.][0-9]+)?([.][0-9]+)?([+-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Unsupported version syntax: ${version}"
            exit 1
          fi

          upload_release=false
          if [[ -n "${release_tag}" ]]; then
            upload_release=true
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "upload_release=${upload_release}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Validate release version metadata
        shell: pwsh
        run: >
          ./Scripts/ci/Test-ReleaseVersion.ps1
          -ResolvedVersion '${{ steps.metadata.outputs.version }}'
          -EventName '${{ github.event_name }}'
          -ReleaseTag '${{ github.event.release.tag_name }}'

  build:
    name: Read-only AppImage gates
    needs: prepare
    uses: ./.github/workflows/appimage-build.yml
    with:
      checkout_ref: ${{ needs.prepare.outputs.source_sha }}
      version: ${{ needs.prepare.outputs.version }}

  release-upload:
    name: Upload complete AppImage set to GitHub release
    if: ${{ needs.prepare.outputs.upload_release == 'true' }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download both AppImage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: DevProjex-${{ needs.prepare.outputs.version }}-*.AppImage
          path: artifacts
          merge-multiple: true

      - name: Validate complete release set
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          expected=(
            "artifacts/DevProjex-${VERSION}-x86_64.AppImage"
            "artifacts/DevProjex-${VERSION}-aarch64.AppImage"
          )
          mapfile -t actual < <(find artifacts -maxdepth 1 -type f -name '*.AppImage' -print | sort)
          [[ "${#actual[@]}" -eq 2 ]]
          for appimage in "${expected[@]}"; do
            [[ -s "${appimage}" ]]
          done

      - name: Upload AppImages to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" \
            "artifacts/DevProjex-${VERSION}-x86_64.AppImage" \
            "artifacts/DevProjex-${VERSION}-aarch64.AppImage" \
            --clobber

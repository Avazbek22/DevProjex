name: .NET CI

# CI tier 1, 2, and 3. Policy: .github/workflows/README.md
# The change planner (Scripts/ci/Select-CiPlan.ps1) decides which suites and operating systems
# run for a pull request; unclassified paths fall back to the full plan. A new product test goes
# into an existing suite and needs no edit here. Do not add a `push: v*` trigger: every merge
# into v5.x is also a synchronize of the open release PR, which already runs this workflow.
# The three-OS matrix stays on pull requests on purpose: Windows and macOS path, PTY, and file
# system differences are found here, not later.

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: Commit or ref to validate
        required: false
        type: string
      force_full:
        description: Run every CI job without changed-path filtering
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  checks: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DEVPROJEX_FAST_UI_TESTS: 1
  DEVPROJEX_SKIP_TUI_PTY_TESTS: 1

concurrency:
  group: dotnet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-matrix:
    name: Plan CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.test_matrix }}
      has_test_matrix: ${{ steps.plan.outputs.has_test_matrix }}
      run_terminal_command: ${{ steps.plan.outputs.run_terminal_command }}
      run_ignore_scanner: ${{ steps.plan.outputs.run_ignore_scanner }}
      run_documentation: ${{ steps.plan.outputs.run_documentation }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          fetch-depth: 0

      - name: Validate CI planner contracts
        shell: pwsh
        run: ./Scripts/ci/Test-CiChangePlanner.ps1

      - name: Select CI plan
        id: plan
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIOUS_GATE_NAME: CI Gate
          FORCE_FULL: ${{ inputs.force_full }}
        run: |
          $common = @{
            PreviousGateName = $env:PREVIOUS_GATE_NAME
            GitHubOutputPath = $env:GITHUB_OUTPUT
          }
          if ($env:FORCE_FULL -eq 'true') {
            ./Scripts/ci/Select-CiPlan.ps1 -Full @common
          }
          else {
            ./Scripts/ci/Select-CiPlan.ps1 `
              -GitHubEventPath $env:GITHUB_EVENT_PATH `
              -GitHubEventName $env:GITHUB_EVENT_NAME `
              @common
          }

  workflow-lint:
    name: Workflow syntax
    if: ${{ github.event_name == 'pull_request' || inputs.force_full == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Lint GitHub Actions workflows
        shell: bash
        run: >
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          -shellcheck=
          .github/workflows/dotnet.yml
          .github/workflows/release-validate.yml
          .github/workflows/release-candidate.yml
          .github/workflows/headless-build.yml
          .github/workflows/container-build.yml
          .github/workflows/packages-build.yml
          .github/workflows/appimage-build.yml
          .github/workflows/package-headless.yml
          .github/workflows/publish-container.yml
          .github/workflows/publish-packages.yml
          .github/workflows/package-appimage.yml
          .github/workflows/grammar-delivery.yml
          .github/workflows/store-package-smoke.yml

  test-suite:
    name: CI (${{ matrix.os_name }} / ${{ matrix.suite_name }})
    needs: prepare-matrix
    if: ${{ needs.prepare-matrix.outputs.has_test_matrix == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        shell: pwsh
        run: dotnet restore ${{ matrix.project_path }}

      - name: Build
        shell: pwsh
        run: dotnet build ${{ matrix.project_path }} -c Release --no-restore

      - name: Ensure Linux headless runner
        if: ${{ matrix.os_id == 'linux' }}
        shell: bash
        run: |
          missing_packages=()
          command -v xvfb-run >/dev/null 2>&1 || missing_packages+=(xvfb)
          command -v zsh >/dev/null 2>&1 || missing_packages+=(zsh)
          command -v fish >/dev/null 2>&1 || missing_packages+=(fish)
          if (( ${#missing_packages[@]} > 0 )); then
            sudo apt-get update
            sudo apt-get install -y "${missing_packages[@]}"
          fi

      - name: Run ${{ matrix.suite_name }} Tests
        if: ${{ matrix.os_id != 'linux' && matrix.suite_id != 'ui' }}
        shell: pwsh
        run: >
          dotnet test ${{ matrix.project_path }}
          -c Release
          --no-build
          --verbosity minimal
          ${{ matrix.test_filter_args }}
          --logger "trx;LogFileName=${{ matrix.trx_name }}"
          --results-directory "TestResults/${{ matrix.suite_id }}"
          --blame-hang
          --blame-hang-timeout 8m
          --blame-hang-dump-type mini

      - name: Run UI Tests
        if: ${{ matrix.os_id != 'linux' && matrix.suite_id == 'ui' }}
        shell: pwsh
        run: >
          dotnet test ${{ matrix.project_path }}
          -c Release
          --no-build
          --verbosity minimal
          --
          --results-directory "TestResults/${{ matrix.suite_id }}"
          --report-xunit-trx
          --report-xunit-trx-filename "${{ matrix.trx_name }}"
          --timeout 20m

      - name: Run ${{ matrix.suite_name }} Tests (Linux headless)
        if: ${{ matrix.os_id == 'linux' && matrix.suite_id != 'ui' }}
        shell: bash
        run: >
          xvfb-run -a dotnet test ${{ matrix.project_path }}
          -c Release
          --no-build
          --verbosity minimal
          ${{ matrix.test_filter_args }}
          --logger "trx;LogFileName=${{ matrix.trx_name }}"
          --results-directory "TestResults/${{ matrix.suite_id }}"
          --blame-hang
          --blame-hang-timeout 8m
          --blame-hang-dump-type mini

      - name: Run UI Tests (Linux headless)
        if: ${{ matrix.os_id == 'linux' && matrix.suite_id == 'ui' }}
        shell: bash
        run: >
          xvfb-run -a dotnet test ${{ matrix.project_path }}
          -c Release
          --no-build
          --verbosity minimal
          --
          --results-directory "TestResults/${{ matrix.suite_id }}"
          --report-xunit-trx
          --report-xunit-trx-filename "${{ matrix.trx_name }}"
          --timeout 20m

      - name: Print Test Runner Logs
        if: ${{ failure() }}
        shell: pwsh
        run: |
          Get-ChildItem -Path "." -Recurse -Directory -Filter "TestResults" |
            ForEach-Object { Get-ChildItem -LiteralPath $_.FullName -Recurse -File -Include "*.log", "*.trx", "*.txt" } |
            ForEach-Object {
              Write-Host "::group::$($_.FullName)"
              Get-Content -Path $_.FullName -Raw
              Write-Host "::endgroup::"
            }

      - name: Upload Test Results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os_id }}-${{ matrix.suite_id }}
          path: |
            TestResults/**
            **/TestResults/**
          if-no-files-found: ignore

  terminal-command-cross-platform:
    name: Terminal Command Matrix (${{ matrix.os_name }})
    needs: prepare-matrix
    if: ${{ needs.prepare-matrix.outputs.run_terminal_command == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: Windows
            runner: windows-latest
            os_id: windows
          - os_name: Linux
            runner: ubuntu-latest
            os_id: linux
          - os_name: macOS
            runner: macos-latest
            os_id: macos

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-terminal-command-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Packages.props') }}
          restore-keys: |
            nuget-terminal-command-${{ runner.os }}-
            nuget-${{ runner.os }}-

      - name: Restore terminal command tests
        shell: pwsh
        run: |
          dotnet restore Tests/DevProjex.Tests.Unit/DevProjex.Tests.Unit.csproj
          dotnet restore Tests/DevProjex.Tests.Integration/DevProjex.Tests.Integration.csproj

      - name: Build terminal command tests
        shell: pwsh
        run: |
          dotnet build Tests/DevProjex.Tests.Unit/DevProjex.Tests.Unit.csproj -c Release --no-restore
          dotnet build Tests/DevProjex.Tests.Integration/DevProjex.Tests.Integration.csproj -c Release --no-restore

      - name: Ensure Linux headless runner
        if: ${{ matrix.os_id == 'linux' }}
        shell: bash
        run: |
          missing_packages=()
          command -v xvfb-run >/dev/null 2>&1 || missing_packages+=(xvfb)
          command -v zsh >/dev/null 2>&1 || missing_packages+=(zsh)
          command -v fish >/dev/null 2>&1 || missing_packages+=(fish)
          if (( ${#missing_packages[@]} > 0 )); then
            sudo apt-get update
            sudo apt-get install -y "${missing_packages[@]}"
          fi

          command -v xvfb-run
          zsh --version
          fish --version

      - name: Run terminal command unit tests
        if: ${{ matrix.os_id != 'linux' }}
        shell: pwsh
        run: >
          dotnet test Tests/DevProjex.Tests.Unit/DevProjex.Tests.Unit.csproj
          -c Release
          --no-build
          --verbosity minimal
          --filter "Category=TerminalCommand"
          --logger "trx;LogFileName=terminal-command-unit.trx"
          --results-directory "TestResults/terminal-command-unit"

      - name: Run terminal command unit tests (Linux headless)
        if: ${{ matrix.os_id == 'linux' }}
        shell: bash
        run: >
          xvfb-run -a dotnet test Tests/DevProjex.Tests.Unit/DevProjex.Tests.Unit.csproj
          -c Release
          --no-build
          --verbosity minimal
          --filter "Category=TerminalCommand"
          --logger "trx;LogFileName=terminal-command-unit.trx"
          --results-directory "TestResults/terminal-command-unit"

      - name: Run terminal command integration tests
        if: ${{ matrix.os_id != 'linux' }}
        shell: pwsh
        run: >
          dotnet test Tests/DevProjex.Tests.Integration/DevProjex.Tests.Integration.csproj
          -c Release
          --no-build
          --verbosity minimal
          --filter "Category=TerminalCommand"
          --logger "trx;LogFileName=terminal-command-integration.trx"
          --results-directory "TestResults/terminal-command-integration"

      - name: Run terminal command integration tests (Linux headless)
        if: ${{ matrix.os_id == 'linux' }}
        shell: bash
        env:
          DEVPROJEX_REQUIRE_TERMINAL_SHELL_MATRIX: 1
        run: >
          xvfb-run -a dotnet test Tests/DevProjex.Tests.Integration/DevProjex.Tests.Integration.csproj
          -c Release
          --no-build
          --verbosity minimal
          --filter "Category=TerminalCommand"
          --logger "trx;LogFileName=terminal-command-integration.trx"
          --results-directory "TestResults/terminal-command-integration"

      - name: Print terminal command test runner logs
        if: ${{ failure() }}
        shell: pwsh
        run: |
          Get-ChildItem -Path "." -Recurse -Directory -Filter "TestResults" |
            ForEach-Object { Get-ChildItem -LiteralPath $_.FullName -Recurse -File -Include "*.log", "*.trx", "*.txt" } |
            ForEach-Object {
              Write-Host "::group::$($_.FullName)"
              Get-Content -Path $_.FullName -Raw
              Write-Host "::endgroup::"
            }

      - name: Upload terminal command results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: terminal-command-results-${{ matrix.os_id }}
          path: |
            TestResults/**
            **/TestResults/**
          if-no-files-found: ignore

  ignore-scanner-cross-platform:
    name: Ignore/Scanner Matrix (${{ matrix.os_name }})
    needs: prepare-matrix
    if: ${{ needs.prepare-matrix.outputs.run_ignore_scanner == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: Windows
            runner: windows-latest
            os_id: windows
            run_large_perf_tests: "0"
          - os_name: Linux
            runner: ubuntu-latest
            os_id: linux
            run_large_perf_tests: "1"
          - os_name: macOS
            runner: macos-latest
            os_id: macos
            run_large_perf_tests: "0"

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-ignore-scanner-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            nuget-ignore-scanner-${{ runner.os }}-
            nuget-${{ runner.os }}-

      - name: Restore integration tests
        shell: pwsh
        run: dotnet restore Tests/DevProjex.Tests.Integration/DevProjex.Tests.Integration.csproj

      - name: Build integration tests
        shell: pwsh
        run: dotnet build Tests/DevProjex.Tests.Integration/DevProjex.Tests.Integration.csproj -c Release --no-restore

      - name: Run ignore/scanner integration tests
        shell: pwsh
        env:
          DEVPROJEX_RUN_LARGE_PERF_TESTS: ${{ matrix.run_large_perf_tests }}
        run: >
          dotnet test Tests/DevProjex.Tests.Integration/DevProjex.Tests.Integration.csproj
          -c Release
          --no-build
          --verbosity minimal
          --filter "Category=IgnoreContract|FullyQualifiedName~Ignore|FullyQualifiedName~Scanner|FullyQualifiedName~ReparsePoint|FullyQualifiedName~FileSystemMutation"
          --logger "trx;LogFileName=ignore-scanner.trx"
          --results-directory "TestResults/ignore-scanner"

      - name: Print ignore/scanner test runner logs
        if: ${{ failure() }}
        shell: pwsh
        run: |
          Get-ChildItem -Path "." -Recurse -Directory -Filter "TestResults" |
            ForEach-Object { Get-ChildItem -LiteralPath $_.FullName -Recurse -File -Include "*.log", "*.trx", "*.txt" } |
            ForEach-Object {
              Write-Host "::group::$($_.FullName)"
              Get-Content -Path $_.FullName -Raw
              Write-Host "::endgroup::"
            }

      - name: Upload ignore/scanner results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ignore-scanner-results-${{ matrix.os_id }}
          path: |
            TestResults/**
            **/TestResults/**
          if-no-files-found: ignore

  documentation-contracts:
    name: Documentation Contracts
    needs: prepare-matrix
    if: ${{ needs.prepare-matrix.outputs.run_documentation == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-documentation-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Packages.props') }}
          restore-keys: |
            nuget-documentation-${{ runner.os }}-
            nuget-${{ runner.os }}-

      - name: Run documentation contract tests
        shell: pwsh
        run: |
          dotnet test Tests/DevProjex.Tests.Terminal/DevProjex.Tests.Terminal.csproj -c Release --verbosity minimal --filter "FullyQualifiedName~DocumentationAndPackagingContractTests|FullyQualifiedName~DocumentationExecutionRegressionTests"

  ranking-eval-tests:
    name: Ranking Evaluator Tests
    needs: prepare-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build and test RankingEval
        shell: pwsh
        run: |
          dotnet build tools/RankingEval/RankingEval.csproj -c Release
          dotnet test tools/RankingEval/Tests/RankingEval.Tests.csproj -c Release --verbosity minimal --filter "FullyQualifiedName~EvaluationMetricsTests"

  ci-gate:
    name: CI Gate
    needs:
      - prepare-matrix
      - test-suite
      - terminal-command-cross-platform
      - ignore-scanner-cross-platform
      - documentation-contracts
      - ranking-eval-tests
      - workflow-lint
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify selected jobs
        shell: pwsh
        env:
          PREPARE_RESULT: ${{ needs.prepare-matrix.result }}
          TEST_RESULT: ${{ needs.test-suite.result }}
          TERMINAL_COMMAND_RESULT: ${{ needs.terminal-command-cross-platform.result }}
          IGNORE_SCANNER_RESULT: ${{ needs.ignore-scanner-cross-platform.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation-contracts.result }}
          RANKING_EVAL_RESULT: ${{ needs.ranking-eval-tests.result }}
          WORKFLOW_LINT_RESULT: ${{ needs.workflow-lint.result }}
          FORCE_FULL: ${{ inputs.force_full }}
        run: |
          $results = @{
            plan = $env:PREPARE_RESULT
            tests = $env:TEST_RESULT
            terminalCommand = $env:TERMINAL_COMMAND_RESULT
            ignoreScanner = $env:IGNORE_SCANNER_RESULT
            documentation = $env:DOCUMENTATION_RESULT
            rankingEval = $env:RANKING_EVAL_RESULT
            workflowLint = $env:WORKFLOW_LINT_RESULT
          }
          $accepted = if ($env:FORCE_FULL -eq 'true') { @('success') } else { @('success', 'skipped') }
          $failed = @($results.GetEnumerator() | Where-Object { $_.Value -notin $accepted })
          if ($failed.Count -gt 0) {
            $details = $failed.ForEach({ "$($_.Key)=$($_.Value)" }) -join ', '
            throw "Selected CI jobs failed: $details"
          }

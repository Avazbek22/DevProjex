name: .NET CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DEVPROJEX_FAST_UI_TESTS: 1

concurrency:
  group: dotnet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-matrix:
    name: Prepare CI Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Select CI matrix
        id: set-matrix
        shell: pwsh
        run: |
          $matrix = @{
            include = @(
              @{ os_name = 'Windows'; runner = 'windows-latest'; os_id = 'windows'; suite_name = 'Unit'; suite_id = 'unit'; project_path = 'Tests/DevProjex.Tests.Unit/DevProjex.Tests.Unit.csproj'; trx_name = 'unit.trx' },
              @{ os_name = 'Windows'; runner = 'windows-latest'; os_id = 'windows'; suite_name = 'Integration'; suite_id = 'integration'; project_path = 'Tests/DevProjex.Tests.Integration/DevProjex.Tests.Integration.csproj'; trx_name = 'integration.trx' },
              @{ os_name = 'Windows'; runner = 'windows-latest'; os_id = 'windows'; suite_name = 'UI'; suite_id = 'ui'; project_path = 'Tests/DevProjex.Tests.UI/DevProjex.Tests.UI.csproj'; trx_name = 'ui.trx' },
              @{ os_name = 'Linux'; runner = 'ubuntu-latest'; os_id = 'linux'; suite_name = 'Unit'; suite_id = 'unit'; project_path = 'Tests/DevProjex.Tests.Unit/DevProjex.Tests.Unit.csproj'; trx_name = 'unit.trx' },
              @{ os_name = 'Linux'; runner = 'ubuntu-latest'; os_id = 'linux'; suite_name = 'Integration'; suite_id = 'integration'; project_path = 'Tests/DevProjex.Tests.Integration/DevProjex.Tests.Integration.csproj'; trx_name = 'integration.trx' },
              @{ os_name = 'Linux'; runner = 'ubuntu-latest'; os_id = 'linux'; suite_name = 'UI'; suite_id = 'ui'; project_path = 'Tests/DevProjex.Tests.UI/DevProjex.Tests.UI.csproj'; trx_name = 'ui.trx' },
              @{ os_name = 'macOS'; runner = 'macos-latest'; os_id = 'macos'; suite_name = 'Unit'; suite_id = 'unit'; project_path = 'Tests/DevProjex.Tests.Unit/DevProjex.Tests.Unit.csproj'; trx_name = 'unit.trx' },
              @{ os_name = 'macOS'; runner = 'macos-latest'; os_id = 'macos'; suite_name = 'Integration'; suite_id = 'integration'; project_path = 'Tests/DevProjex.Tests.Integration/DevProjex.Tests.Integration.csproj'; trx_name = 'integration.trx' },
              @{ os_name = 'macOS'; runner = 'macos-latest'; os_id = 'macos'; suite_name = 'UI'; suite_id = 'ui'; project_path = 'Tests/DevProjex.Tests.UI/DevProjex.Tests.UI.csproj'; trx_name = 'ui.trx' }
            )
          }

          "matrix=$($matrix | ConvertTo-Json -Compress -Depth 5)" >> $env:GITHUB_OUTPUT

  test-suite:
    name: CI (${{ matrix.os_name }} / ${{ matrix.suite_name }})
    needs: prepare-matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        shell: pwsh
        run: dotnet restore ${{ matrix.project_path }}

      - name: Build
        shell: pwsh
        run: dotnet build ${{ matrix.project_path }} -c Release --no-restore

      - name: Ensure Linux headless runner
        if: ${{ matrix.os_id == 'linux' }}
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Run ${{ matrix.suite_name }} Tests
        if: ${{ matrix.os_id != 'linux' }}
        shell: pwsh
        run: >
          dotnet test ${{ matrix.project_path }}
          -c Release
          --no-build
          --verbosity minimal
          --logger "trx;LogFileName=${{ matrix.trx_name }}"
          --results-directory "TestResults/${{ matrix.suite_id }}"
          --blame-hang
          --blame-hang-timeout 8m
          --blame-hang-dump-type mini

      - name: Run ${{ matrix.suite_name }} Tests (Linux headless)
        if: ${{ matrix.os_id == 'linux' }}
        shell: bash
        run: >
          xvfb-run -a dotnet test ${{ matrix.project_path }}
          -c Release
          --no-build
          --verbosity minimal
          --logger "trx;LogFileName=${{ matrix.trx_name }}"
          --results-directory "TestResults/${{ matrix.suite_id }}"
          --blame-hang
          --blame-hang-timeout 8m
          --blame-hang-dump-type mini

      - name: Print Test Runner Logs
        if: ${{ failure() }}
        shell: pwsh
        run: |
          Get-ChildItem -Path "." -Recurse -Directory -Filter "TestResults" |
            ForEach-Object { Get-ChildItem -LiteralPath $_.FullName -Recurse -File -Include "*.log", "*.trx", "*.txt" } |
            ForEach-Object {
              Write-Host "::group::$($_.FullName)"
              Get-Content -Path $_.FullName -Raw
              Write-Host "::endgroup::"
            }

      - name: Upload Test Results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os_id }}-${{ matrix.suite_id }}
          path: |
            TestResults/**
            **/TestResults/**
          if-no-files-found: ignore

  terminal-command-cross-platform:
    name: Terminal Command Matrix (${{ matrix.os_name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: Windows
            runner: windows-latest
            os_id: windows
          - os_name: Linux
            runner: ubuntu-latest
            os_id: linux
          - os_name: macOS
            runner: macos-latest
            os_id: macos

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-terminal-command-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Packages.props') }}
          restore-keys: |
            nuget-terminal-command-${{ runner.os }}-
            nuget-${{ runner.os }}-

      - name: Restore terminal command tests
        shell: pwsh
        run: |
          dotnet restore Tests/DevProjex.Tests.Unit/DevProjex.Tests.Unit.csproj
          dotnet restore Tests/DevProjex.Tests.Integration/DevProjex.Tests.Integration.csproj

      - name: Build terminal command tests
        shell: pwsh
        run: |
          dotnet build Tests/DevProjex.Tests.Unit/DevProjex.Tests.Unit.csproj -c Release --no-restore
          dotnet build Tests/DevProjex.Tests.Integration/DevProjex.Tests.Integration.csproj -c Release --no-restore

      - name: Ensure Linux headless runner
        if: ${{ matrix.os_id == 'linux' }}
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Run terminal command unit tests
        if: ${{ matrix.os_id != 'linux' }}
        shell: pwsh
        run: >
          dotnet test Tests/DevProjex.Tests.Unit/DevProjex.Tests.Unit.csproj
          -c Release
          --no-build
          --verbosity minimal
          --filter "Category=TerminalCommand"
          --logger "trx;LogFileName=terminal-command-unit.trx"
          --results-directory "TestResults/terminal-command-unit"

      - name: Run terminal command unit tests (Linux headless)
        if: ${{ matrix.os_id == 'linux' }}
        shell: bash
        run: >
          xvfb-run -a dotnet test Tests/DevProjex.Tests.Unit/DevProjex.Tests.Unit.csproj
          -c Release
          --no-build
          --verbosity minimal
          --filter "Category=TerminalCommand"
          --logger "trx;LogFileName=terminal-command-unit.trx"
          --results-directory "TestResults/terminal-command-unit"

      - name: Run terminal command integration tests
        if: ${{ matrix.os_id != 'linux' }}
        shell: pwsh
        run: >
          dotnet test Tests/DevProjex.Tests.Integration/DevProjex.Tests.Integration.csproj
          -c Release
          --no-build
          --verbosity minimal
          --filter "Category=TerminalCommand"
          --logger "trx;LogFileName=terminal-command-integration.trx"
          --results-directory "TestResults/terminal-command-integration"

      - name: Run terminal command integration tests (Linux headless)
        if: ${{ matrix.os_id == 'linux' }}
        shell: bash
        run: >
          xvfb-run -a dotnet test Tests/DevProjex.Tests.Integration/DevProjex.Tests.Integration.csproj
          -c Release
          --no-build
          --verbosity minimal
          --filter "Category=TerminalCommand"
          --logger "trx;LogFileName=terminal-command-integration.trx"
          --results-directory "TestResults/terminal-command-integration"

      - name: Print terminal command test runner logs
        if: ${{ failure() }}
        shell: pwsh
        run: |
          Get-ChildItem -Path "." -Recurse -Directory -Filter "TestResults" |
            ForEach-Object { Get-ChildItem -LiteralPath $_.FullName -Recurse -File -Include "*.log", "*.trx", "*.txt" } |
            ForEach-Object {
              Write-Host "::group::$($_.FullName)"
              Get-Content -Path $_.FullName -Raw
              Write-Host "::endgroup::"
            }

      - name: Upload terminal command results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: terminal-command-results-${{ matrix.os_id }}
          path: |
            TestResults/**
            **/TestResults/**
          if-no-files-found: ignore

  ignore-scanner-cross-platform:
    name: Ignore/Scanner Matrix (${{ matrix.os_name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: Windows
            runner: windows-latest
            os_id: windows
          - os_name: Linux
            runner: ubuntu-latest
            os_id: linux
          - os_name: macOS
            runner: macos-latest
            os_id: macos

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-ignore-scanner-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            nuget-ignore-scanner-${{ runner.os }}-
            nuget-${{ runner.os }}-

      - name: Restore integration tests
        shell: pwsh
        run: dotnet restore Tests/DevProjex.Tests.Integration/DevProjex.Tests.Integration.csproj

      - name: Build integration tests
        shell: pwsh
        run: dotnet build Tests/DevProjex.Tests.Integration/DevProjex.Tests.Integration.csproj -c Release --no-restore

      - name: Run ignore/scanner integration tests
        shell: pwsh
        run: >
          dotnet test Tests/DevProjex.Tests.Integration/DevProjex.Tests.Integration.csproj
          -c Release
          --no-build
          --verbosity minimal
          --filter "FullyQualifiedName~Ignore|FullyQualifiedName~Scanner|FullyQualifiedName~ReparsePoint|FullyQualifiedName~FileSystemMutation"
          --logger "trx;LogFileName=ignore-scanner.trx"
          --results-directory "TestResults/ignore-scanner"

      - name: Print ignore/scanner test runner logs
        if: ${{ failure() }}
        shell: pwsh
        run: |
          Get-ChildItem -Path "." -Recurse -Directory -Filter "TestResults" |
            ForEach-Object { Get-ChildItem -LiteralPath $_.FullName -Recurse -File -Include "*.log", "*.trx", "*.txt" } |
            ForEach-Object {
              Write-Host "::group::$($_.FullName)"
              Get-Content -Path $_.FullName -Raw
              Write-Host "::endgroup::"
            }

      - name: Upload ignore/scanner results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ignore-scanner-results-${{ matrix.os_id }}
          path: |
            TestResults/**
            **/TestResults/**
          if-no-files-found: ignore

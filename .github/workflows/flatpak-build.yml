name: Flatpak Build

# Read-only packaging gate; no GitHub release assets or Flathub publication.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: Commit or ref to build
        required: false
        type: string
  pull_request:
    branches-ignore: [master]
    paths:
      - 'Packaging/Linux/flatpak/**'
      - 'Packaging/Linux/*.desktop'
      - 'Packaging/Linux/*.metainfo.xml'
      - '.github/workflows/flatpak-build.yml'
  push:
    branches: [master, 'v*']

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  build:
    name: Flatpak (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Generate native-architecture offline NuGet sources
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.flatpak.Builder
          bash Packaging/Linux/flatpak/prepare-source.sh
          bash Packaging/Linux/flatpak/regenerate-nuget.sh "$TARGET_ARCH"
          python3 Packaging/Linux/flatpak/generate-grammar-modules.py
      - name: Validate manifest and metadata
        shell: bash
        run: |
          set -euo pipefail
          appstreamcli validate --strict --explain Packaging/Linux/io.github.Avazbek22.DevProjex.metainfo.xml
          python3 Packaging/Linux/flatpak/check-lint.py manifest Packaging/Linux/flatpak/io.github.Avazbek22.DevProjex.yml
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          manifest-path: Packaging/Linux/flatpak/io.github.Avazbek22.DevProjex.yml
          arch: ${{ matrix.arch }}
          bundle: DevProjex-${{ matrix.arch }}.flatpak
          build-dir: flatpak_app
          mirror-screenshots-url: https://dl.flathub.org/media
          upload-artifact: true
      - name: Check installed sandbox metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 Packaging/Linux/flatpak/check-lint.py builddir flatpak_app
          python3 Packaging/Linux/flatpak/check-lint.py repo repo
          flatpak install --user --noninteractive ./DevProjex-"$(uname -m)".flatpak
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Check installed CLI, MCP, live context and desktop
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/flatpak-smoke-python"
          "$RUNNER_TEMP/flatpak-smoke-python/bin/pip" install -r Packaging/Linux/flatpak/smoke-requirements.txt
          export PATH="$RUNNER_TEMP/flatpak-smoke-python/bin:$PATH"
          xvfb-run -a -s '-screen 0 1920x1080x24' dbus-run-session -- \
            bash Packaging/Linux/flatpak/smoke.sh "$GITHUB_WORKSPACE/flatpak-smoke-evidence"
      - name: Upload sandbox check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-checks-${{ matrix.arch }}
          path: flatpak-smoke-evidence/
          if-no-files-found: ignore

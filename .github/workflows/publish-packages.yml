name: Publish Headless Packages

on:
  release:
    types: [published]
  pull_request:
    branches: [v5.2, master]
    paths:
      - '.github/workflows/publish-packages.yml'
      - '.github/workflows/packages-build.yml'
      - 'Apps/Terminal/**'
      - 'Apps/TerminalHost/**'
      - 'Apps/Mcp/**'
      - 'Assets/Localization/**'
      - 'Application/**'
      - 'Infrastructure/**'
      - 'Kernel/**'
      - 'Packaging/Headless/**'
      - 'Packaging/Npm/**'
      - 'Scripts/*Headless*'
      - 'Tests/DevProjex.Tests.Terminal/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'Scripts/ci/Test-ReleaseVersion.ps1'
  workflow_dispatch:
    inputs:
      version:
        description: DevProjex display version (for example 5.2 or 5.2.0)
        required: true
        default: '5.2'
        type: string
      channels:
        description: Channels to publish after every gate passes
        required: true
        default: both
        type: choice
        options: [nuget, npm, both]
      dry_run:
        description: Build and gate without publishing
        required: true
        default: true
        type: boolean
  workflow_call:
    inputs:
      checkout_ref:
        description: Commit or ref to validate
        required: false
        type: string
      version:
        description: Optional package version; defaults to Directory.Build.props
        required: false
        type: string
      channels:
        description: Channels to gate
        required: false
        default: both
        type: string
      dry_run:
        description: Build and gate without publishing
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-headless-packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  prepare:
    name: Resolve package version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      display_version: ${{ steps.version.outputs.display_version }}
      package_version: ${{ steps.version.outputs.package_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          $displayVersion = if ('${{ github.event_name }}' -ceq 'release') {
            '${{ github.event.release.tag_name }}'.TrimStart('v')
          } elseif ('${{ github.event_name }}' -ceq 'pull_request' -or [string]::IsNullOrWhiteSpace('${{ inputs.version }}')) {
            $buildProps = [xml](Get-Content Directory.Build.props -Raw)
            $versionNode = $buildProps.SelectSingleNode('/Project/PropertyGroup/DevProjexVersion')
            if ($null -eq $versionNode -or [string]::IsNullOrWhiteSpace($versionNode.InnerText)) {
              throw 'DevProjexVersion was not found in Directory.Build.props.'
            }
            $versionNode.InnerText.Trim()
          } else {
            '${{ inputs.version }}'
          }
          if ([string]::IsNullOrWhiteSpace($displayVersion)) {
            throw 'Could not resolve the DevProjex display version.'
          }
          $packageVersion = $displayVersion
          if ($packageVersion -match '^(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            $packageVersion = "$packageVersion.0"
          }
          if ($packageVersion -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)([-+].+)?$') {
            throw "Version '${{ inputs.version }}' is not a supported semantic version."
          }
          "display_version=$displayVersion" >> $env:GITHUB_OUTPUT
          "package_version=$packageVersion" >> $env:GITHUB_OUTPUT

      - name: Validate release version metadata
        shell: pwsh
        run: >
          ./Scripts/ci/Test-ReleaseVersion.ps1
          -ResolvedVersion '${{ steps.version.outputs.display_version }}'
          -EventName '${{ github.event_name }}'
          -ReleaseTag '${{ github.event.release.tag_name }}'

  build:
    name: Read-only package gates
    needs: prepare
    uses: ./.github/workflows/packages-build.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.ref }}
      display_version: ${{ needs.prepare.outputs.display_version }}
      package_version: ${{ needs.prepare.outputs.package_version }}

  publish-nuget:
    name: Publish NuGet packages
    needs: [prepare, build]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false && (inputs.channels == 'nuget' || inputs.channels == 'both') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: headless-packages
          path: artifacts/headless

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Exchange OIDC token for a temporary NuGet key
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish RID packages, then pointer
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          VERSION: ${{ needs.prepare.outputs.package_version }}
        run: |
          Get-ChildItem artifacts/headless/nuget/devprojex.*-*.$env:VERSION.nupkg | Sort-Object Name | ForEach-Object {
            dotnet nuget push $_.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
            if ($LASTEXITCODE -ne 0) { throw "NuGet push failed for $($_.Name)." }
          }
          dotnet nuget push "artifacts/headless/nuget/devprojex.$env:VERSION.nupkg" `
            --api-key $env:NUGET_API_KEY `
            --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'NuGet pointer push failed.' }

  publish-npm:
    name: Publish npm packages
    needs: [prepare, build]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false && (inputs.channels == 'npm' || inputs.channels == 'both') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: headless-packages
          path: artifacts/headless

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@latest

      - name: Publish platform packages, then launcher
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.package_version }}
        run: |
          $npmVersion = [version]((npm --version).Trim())
          if ($npmVersion -lt [version]'11.5.1') { throw "npm $npmVersion does not support trusted publishing." }
          Get-ChildItem artifacts/headless/npm/devprojex-cli-*.tgz | Sort-Object Name | ForEach-Object {
            npm publish $_.FullName --access public
            if ($LASTEXITCODE -ne 0) { throw "npm publish failed for $($_.Name)." }
          }
          npm publish "artifacts/headless/npm/devprojex-$env:VERSION.tgz" --access public
          if ($LASTEXITCODE -ne 0) { throw 'npm launcher publish failed.' }

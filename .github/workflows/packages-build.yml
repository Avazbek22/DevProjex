name: Headless Packages Build

# CI tier: reusable read-only gate, `workflow_call` only. Policy: .github/workflows/README.md
# Called by publish-packages.yml and release-candidate.yml. Keep `contents: read` and no write
# permission: a called job may not request more than the caller grants. Never add pull_request
# or push triggers here; the publishing wrapper owns the events.

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Commit or ref to validate
        required: true
        type: string
      display_version:
        description: DevProjex display version
        required: true
        type: string
      package_version:
        description: Normalized package version
        required: true
        type: string

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build headless packages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test npm launcher contract
        run: node --test Packaging/Npm/test/*.test.js

      - name: Test resumable package publication
        shell: pwsh
        run: ./Scripts/ci/Test-ResumableHeadlessPublish.ps1

      - name: Build packages through the release entry point
        shell: pwsh
        run: |
          ./Scripts/build-headless-packages.ps1 -Version '${{ inputs.display_version }}' -DryRun
          [System.IO.File]::WriteAllText(
            'artifacts/headless/source-sha.txt',
            '${{ inputs.checkout_ref }}' + [Environment]::NewLine,
            [System.Text.UTF8Encoding]::new($false))

      - name: Upload headless packages
        uses: actions/upload-artifact@v7
        with:
          name: headless-packages
          path: |
            artifacts/headless/nuget/*.nupkg
            artifacts/headless/npm/*.tgz
            artifacts/headless/package-sizes.md
            artifacts/headless/source-sha.txt
          if-no-files-found: error
          retention-days: 7

  gate-static:
    name: Static completeness gate
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}

      - uses: actions/download-artifact@v8
        with:
          name: headless-packages
          path: artifacts/headless

      - name: Validate every package payload
        shell: pwsh
        run: >
          ./Scripts/Test-HeadlessPackages.ps1
          -ArtifactsRoot artifacts/headless
          -Version '${{ inputs.package_version }}'

      - name: Prove the gate fails after one grammar is removed
        shell: pwsh
        run: >
          ./Scripts/Test-HeadlessPackageGateMutation.ps1
          -ArtifactsRoot artifacts/headless
          -Version '${{ inputs.package_version }}'

  smoke:
    name: Artifact smoke (${{ matrix.os }})
    needs: [build, gate-static]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}

      - uses: actions/download-artifact@v8
        with:
          name: headless-packages
          path: artifacts/headless

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Verdaccio
        run: npm install --global verdaccio@6

      - name: Smoke the installed NuGet tool
        shell: pwsh
        env:
          VERSION: ${{ inputs.package_version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $localFeed = (Resolve-Path artifacts/headless/nuget).Path
          $nugetConfig = Join-Path $env:RUNNER_TEMP 'devprojex-local-feed.config'
          $toolRoot = Join-Path $env:RUNNER_TEMP 'devprojex-local-tool'
          $architecture = switch ($env:RUNNER_ARCH) {
            'X64' { 'x64' }
            'ARM64' { 'arm64' }
            default { throw "Unsupported runner architecture '$env:RUNNER_ARCH'." }
          }
          $platform = if ($IsWindows) { 'win' } elseif ($IsMacOS) { 'osx' } else { 'linux' }
          $rid = "$platform-$architecture"
          $ridArtifact = Join-Path $localFeed "devprojex.$rid.$env:VERSION.nupkg"

          . ./Scripts/HeadlessPackagePublishing.ps1
          $runtimeVersion = Get-NuGetToolRuntimeVersion $ridArtifact $rid
          $hostPackageId = "microsoft.netcore.app.host.$rid"
          $hostPackageName = "$hostPackageId.$runtimeVersion.nupkg"
          $hostPackageUri = "https://api.nuget.org/v3-flatcontainer/$hostPackageId/$runtimeVersion/$hostPackageName"
          Invoke-WebRequest -Uri $hostPackageUri -OutFile (Join-Path $localFeed $hostPackageName)

          $env:NUGET_PACKAGES = Join-Path $env:RUNNER_TEMP 'devprojex-local-packages'
          $env:NUGET_HTTP_CACHE_PATH = Join-Path $env:RUNNER_TEMP 'devprojex-local-http-cache'
          $escapedFeed = [System.Security.SecurityElement]::Escape($localFeed)
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="headless-artifacts" value="$escapedFeed" />
            </packageSources>
          </configuration>
          "@ | Set-Content -LiteralPath $nugetConfig -Encoding utf8NoBOM
          dotnet tool install devprojex `
            --tool-path $toolRoot `
            --version $env:VERSION `
            --configfile $nugetConfig `
            --no-cache `
            --arch $architecture
          if ($LASTEXITCODE -ne 0) { throw 'dotnet tool install failed.' }
          $binaryCandidates = @(Get-ChildItem -LiteralPath $toolRoot -File | Where-Object {
            $_.BaseName -ceq 'devprojex' -or $_.Name -ceq 'devprojex'
          })
          if ($binaryCandidates.Count -ne 1) {
            throw "Expected one installed DevProjex shim, found $($binaryCandidates.Count)."
          }
          $binary = $binaryCandidates[0].FullName
          $actualVersion = (& $binary --version).Trim()
          if ($actualVersion -ne '${{ inputs.display_version }}') {
            throw "NuGet tool version mismatch: expected '${{ inputs.display_version }}', got '$actualVersion'."
          }

          foreach ($id in @('devprojex', "devprojex.$rid")) {
            $artifact = Join-Path $localFeed "$id.$env:VERSION.nupkg"
            $installedRoot = Join-Path $toolRoot ".store/devprojex/$env:VERSION/$id/$env:VERSION"
            $installedReceipts = @(Get-ChildItem -LiteralPath $installedRoot -Filter 'payload-receipt.json' -File -Recurse)
            if ($installedReceipts.Count -ne 1 -or
                -not (Test-InstalledNuGetPayloadReceipt $artifact $installedReceipts[0].FullName)) {
              throw "Installed NuGet payload receipt does not match artifact '$id@$env:VERSION'."
            }
          }

          $sample = Join-Path $env:RUNNER_TEMP 'devprojex-headless-sample'
          New-Item -ItemType Directory -Path $sample -Force | Out-Null
          @'
          namespace Sample;
          public static class Program {
              public static int Compute(int value) {
                  var implementationMustDisappear = value * 2;
                  return implementationMustDisappear;
              }
          }
          '@ | Set-Content -LiteralPath (Join-Path $sample 'Program.cs') -Encoding utf8NoBOM
          ('token=' + 'ghp_123456789012345678901234567890123456') |
            Set-Content -LiteralPath (Join-Path $sample 'settings.txt') -Encoding utf8NoBOM

          $tree = & $binary tree $sample --git-mode none --exclude none
          $treeText = $tree -join [Environment]::NewLine
          if ($LASTEXITCODE -ne 0 -or -not $treeText.Contains('Program.cs', [System.StringComparison]::Ordinal)) {
            throw 'NuGet tree smoke failed.'
          }
          $full = & $binary analyze $sample --format json --git-mode none --exclude none -o - | ConvertFrom-Json
          $compressed = & $binary analyze $sample --format json --git-mode none --exclude none --compress-code -o - | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $compressed.metrics.content.chars -ge $full.metrics.content.chars) {
            throw 'NuGet compression smoke did not change the artifact output.'
          }
          $findings = & $binary analyze $sample --format json --git-mode none --exclude none --findings --fail-on-findings -o -
          $findingsText = $findings -join [Environment]::NewLine
          if ($LASTEXITCODE -ne 3 -or -not $findingsText.Contains('findingCount', [System.StringComparison]::Ordinal)) {
            throw 'NuGet secret gate smoke failed.'
          }
          if ($IsWindows) {
            node Scripts/smoke-headless-mcp.mjs $env:ComSpec $sample /d /s /c $binary
          }
          else {
            node Scripts/smoke-headless-mcp.mjs $binary $sample
          }
          if ($LASTEXITCODE -ne 0) { throw 'NuGet MCP initialize smoke failed.' }

      - name: Smoke npx through a local registry
        shell: pwsh
        env:
          VERSION: ${{ inputs.package_version }}
        run: >
          ./Scripts/Smoke-HeadlessNpmPackages.ps1
          -ArtifactsRoot artifacts/headless
          -Version $env:VERSION
          -ExpectedDisplayVersion '${{ inputs.display_version }}'

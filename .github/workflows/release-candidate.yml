name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to validate before creating the release tag
        required: true
        type: string

permissions:
  contents: read
  checks: read

jobs:
  validate-sha:
    name: Pin release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 1

      - name: Verify the pinned commit
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [[ ! "${REQUESTED_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Release candidate must be a full 40-character commit SHA."
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [[ "${actual_sha}" != "${REQUESTED_SHA,,}" ]]; then
            echo "::error::Release candidate checkout mismatch: requested ${REQUESTED_SHA}, got ${actual_sha}."
            exit 1
          fi
          echo "Validated release candidate `${actual_sha}`." >> "${GITHUB_STEP_SUMMARY}"

  dotnet-ci:
    name: .NET CI
    needs: validate-sha
    uses: ./.github/workflows/dotnet.yml
    with:
      checkout_ref: ${{ inputs.sha }}

  release-validation:
    name: Release Validation
    needs: validate-sha
    uses: ./.github/workflows/release-validate.yml
    with:
      checkout_ref: ${{ inputs.sha }}

  headless-archives:
    name: Headless archives
    needs: validate-sha
    uses: ./.github/workflows/package-headless.yml
    with:
      checkout_ref: ${{ inputs.sha }}

  container:
    name: Container dry-run
    needs: validate-sha
    uses: ./.github/workflows/publish-container.yml
    with:
      checkout_ref: ${{ inputs.sha }}

  packages:
    name: Package dry-run
    needs: validate-sha
    uses: ./.github/workflows/publish-packages.yml
    with:
      checkout_ref: ${{ inputs.sha }}
      channels: both
      dry_run: true

  report:
    name: Release candidate report
    if: ${{ always() }}
    needs:
      - validate-sha
      - dotnet-ci
      - release-validation
      - headless-archives
      - container
      - packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize all release gates
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ inputs.sha }}
          PIN_RESULT: ${{ needs.validate-sha.result }}
          DOTNET_RESULT: ${{ needs.dotnet-ci.result }}
          RELEASE_RESULT: ${{ needs.release-validation.result }}
          ARCHIVES_RESULT: ${{ needs.headless-archives.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          PACKAGES_RESULT: ${{ needs.packages.result }}
        run: |
          $results = [ordered]@{
            'Pinned SHA' = $env:PIN_RESULT
            '.NET CI' = $env:DOTNET_RESULT
            'Release Validation' = $env:RELEASE_RESULT
            'Headless archives' = $env:ARCHIVES_RESULT
            'Container dry-run' = $env:CONTAINER_RESULT
            'Package dry-run' = $env:PACKAGES_RESULT
          }
          "## Release candidate ``$env:CANDIDATE_SHA``" >> $env:GITHUB_STEP_SUMMARY
          '' >> $env:GITHUB_STEP_SUMMARY
          '| Gate | Result |' >> $env:GITHUB_STEP_SUMMARY
          '| --- | --- |' >> $env:GITHUB_STEP_SUMMARY
          foreach ($entry in $results.GetEnumerator()) {
            "| $($entry.Key) | $($entry.Value) |" >> $env:GITHUB_STEP_SUMMARY
          }
          $failed = @($results.Values | Where-Object { $_ -cne 'success' })
          if ($failed.Count -ne 0) {
            throw 'At least one release-candidate gate did not succeed.'
          }

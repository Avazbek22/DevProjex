<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-labelledby="title description">
  <title id="title">Support DevProjex on Boosty</title>
  <desc id="description">A red and orange banner linking to Avazbek22 on Boosty</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c90825"/>
      <stop offset="0.52" stop-color="#ed1f32"/>
      <stop offset="1" stop-color="#f9792b"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe1d6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#5b0010" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="12" y="10" width="976" height="180" rx="38" fill="url(#background)" filter="url(#shadow)"/>
  <rect x="13.5" y="11.5" width="973" height="177" rx="36.5" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="3"/>

  <circle cx="112" cy="100" r="62" fill="#ffffff" fill-opacity="0.14"/>
  <circle cx="112" cy="100" r="49" fill="#ffffff" fill-opacity="0.14"/>
  <path
    d="M112 142C99 130 70 111 70 86C70 69 81 59 96 59C105 59 112 64 117 72C122 64 129 59 138 59C153 59 164 69 164 86C164 111 135 130 122 142L117 147Z"
    fill="url(#heart)"/>

  <text x="205" y="64" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">
    SUPPORT THE PROJECT
  </text>
  <text x="205" y="113" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="800">
    Support on Boosty
  </text>
  <text x="205" y="153" fill="#ffffff" fill-opacity="0.86" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="500">
    Help fund development, testing, and future updates
  </text>

  <rect x="815" y="67" width="124" height="66" rx="22" fill="#ffffff"/>
  <text x="877" y="109" fill="#e52a2f" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="900" text-anchor="middle">
    BOOSTY
  </text>
  <path d="M948 100H963M956 93L963 100L956 107" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
